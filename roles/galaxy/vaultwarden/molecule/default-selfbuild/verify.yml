---
- name: Verify Vaultwarden systemd service
  hosts: all
  become: true
  gather_facts: false

  vars:
    vaultwarden_verify_units:
      - vaultwarden.service

  tasks:
    - name: Verify that Vaultwarden works
      block:
        - name: Wait for the Vaultwarden systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: vaultwarden_services
          until: vaultwarden_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ vaultwarden_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Vaultwarden systemd services are active
          ansible.builtin.assert:
            that: vaultwarden_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(vaultwarden_verify_units | zip(vaultwarden_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Vaultwarden systemd services log for debugging
          when: vaultwarden_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ vaultwarden_verify_units }}"

        - name: Wait for Vaultwarden HTTP endpoint to respond (up to 10m)
          ansible.builtin.uri:
            url: "http://localhost:8080/"
            method: GET
            status_code: [200, 302]
            follow_redirects: none
          register: vaultwarden_endpoint
          until: vaultwarden_endpoint.status in [200, 302]
          retries: 120
          delay: 5

        - name: Assert Vaultwarden HTTP endpoint responds
          ansible.builtin.assert:
            that: vaultwarden_endpoint.status in [200, 302]
            fail_msg: "Vaultwarden did not respond as expected ({{ vaultwarden_endpoint.status | default('no response') }})"
            success_msg: "Vaultwarden responded with {{ vaultwarden_endpoint.status }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "vaultwarden_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: vaultwarden_restarts_before
              loop: "{{ vaultwarden_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: vaultwarden_restarts_after
              loop: "{{ vaultwarden_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - vaultwarden_restarts_after.results | map(attribute='status.NRestarts') | list == vaultwarden_restarts_before.results | map(attribute='status.NRestarts') | list
                  - vaultwarden_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in vaultwarden_verify_units | zip(vaultwarden_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in vaultwarden_verify_units | zip(vaultwarden_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in vaultwarden_verify_units | zip(vaultwarden_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Vaultwarden verification summary
          ansible.builtin.debug:
            msg:
              - "Vaultwarden systemd: {% for unit, state in vaultwarden_verify_units | zip(vaultwarden_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Vaultwarden restarts: {% for unit, restarts in vaultwarden_verify_units | zip(vaultwarden_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Vaultwarden HTTP: {{ vaultwarden_endpoint.status }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Vaultwarden systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=vaultwarden.service
          register: vaultwarden_service_log
          changed_when: false

        - name: Show the Vaultwarden systemd service log
          ansible.builtin.debug:
            var: vaultwarden_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Vaultwarden verification failed. The systemd service log is printed above."
