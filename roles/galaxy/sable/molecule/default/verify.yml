---
- name: Verify Sable
  hosts: all
  become: true
  gather_facts: false

  vars:
    sable_molecule_base_url: "http://127.0.0.1:{{ sable_molecule_http_bind_port }}"
    sable_molecule_bundle_path: /tmp/sable-molecule-bundle.js

    sable_verify_units:
      - sable.service

  tasks:
    - name: Verify that Sable works
      block:
        - name: Run the shared Sable verification tasks
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Sable systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=sable.service
          register: sable_service_log
          changed_when: false

        - name: Show the Sable systemd service log
          ansible.builtin.debug:
            var: sable_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Sable verification failed. The systemd service log is printed above."
