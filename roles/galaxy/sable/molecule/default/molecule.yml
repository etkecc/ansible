---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: sable-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        sable_debug_service_enabled: false
        sable_restarts_check_enabled: true

        # The port on the host that Sable is published on. In a real
        # deployment, Sable sits behind a reverse-proxy and is not published
        # at all, so the scenario picks a port itself.
        sable_molecule_http_bind_port: 8080

        # Status codes that the verification requests accept without failing
        # the request task itself. `uri` fails on anything outside this list
        # before an assertion gets to look at the response, which would report
        # a bare status-code error instead of naming the check that went wrong.
        sable_molecule_http_status_codes: [200, 301, 302, 304, 400, 401, 403, 404, 405, 500, 502, 503]

        # Sable's release workflow labels the image it publishes with the
        # version, but the Dockerfile in the repository does not, so only a
        # pulled image carries the label. See `default-selfbuild`.
        sable_molecule_image_carries_version_label: true

        # Variables for Sable
        sable_uid: 1000
        sable_gid: 1000
        sable_scheme: http
        sable_hostname: localhost
        sable_container_labels_traefik_enabled: false
        sable_container_http_host_bind_port: "127.0.0.1:{{ sable_molecule_http_bind_port }}"

        # A bare Sable image ships a `config.json` of its own and serves it
        # from the very same path, so a request for it succeeds whether or not
        # this role did anything. That file lists five homeservers and defaults
        # to the second of them; a hostname that appears nowhere in it is what
        # lets the assertions in `verify.yml` tell the two files apart.
        sable_default_hs_url: https://matrix.molecule.example.com

        # The extension is combined into the rendered configuration, which is
        # how a deployment sets keys the role has no variable for. Overriding
        # `allowCustomHomeservers` (which both the image's own `config.json`
        # and this role's default leave at `true`) and adding `hashRouter`
        # (which the role's template never emits) leaves marks in the served
        # file that neither the image nor the role's defaults can produce.
        sable_configuration_extension_json: |
          {
            "allowCustomHomeservers": false,
            "hashRouter": {
              "enabled": true,
              "basename": "/molecule"
            }
          }
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
