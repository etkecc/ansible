---
# Tasks shared by every scenario.

# The role is not included in this playbook, so its defaults are not in
# scope. Reading defaults/main.yml directly ties the version assertion
# below.
- name: Load the role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: sable_defaults

- name: Wait for the Sable systemd services to become active (up to 180s each)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  register: sable_services
  until: sable_services.status.ActiveState == 'active'
  retries: 36
  delay: 5
  loop: "{{ sable_verify_units }}"
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

# `Restart=always` in the systemd unit means that even a container which crashes
# and gets restarted reads as active here, so this is a precondition rather than
# a result.
- name: Assert the Sable systemd services are active
  ansible.builtin.assert:
    that: sable_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
    fail_msg: >-
      Not every service is active:
      {{ dict(sable_verify_units | zip(sable_services.results | map(attribute='status.ActiveState'))) }}
    success_msg: "Every systemd service is active"

- name: Retrieve the Sable systemd services log for debugging
  when: sable_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
  changed_when: false
  loop: "{{ sable_verify_units }}"

# ------------------------------------------------------------------
# The container the role actually started
# ------------------------------------------------------------------

- name: Inspect the running Sable container
  ansible.builtin.command:
    cmd: docker inspect sable
  register: sable_container_raw
  changed_when: false

- name: Parse the Sable container inspection
  ansible.builtin.set_fact:
    sable_container: "{{ (sable_container_raw.stdout | from_json)[0] }}"

# The systemd unit is what turns the role's variables into `docker create`
# arguments. Reading them back off the running container is what proves
# the values in the inventory reached the process, rather than merely
# having been written into a file somewhere.
- name: Assert the Sable container runs as the configured user
  ansible.builtin.assert:
    that: sable_container.Config.User == (sable_uid | string) ~ ':' ~ (sable_gid | string)
    fail_msg: "The Sable container runs as {{ sable_container.Config.User | default('(unset)') }}, expected {{ sable_uid }}:{{ sable_gid }}"
    success_msg: "The Sable container runs as {{ sable_container.Config.User }}"

- name: Assert the Sable container is hardened as the systemd unit asks
  ansible.builtin.assert:
    that:
      - sable_container.State.Running
      - sable_container.HostConfig.ReadonlyRootfs
      - sable_container.HostConfig.CapDrop == ['ALL']
    fail_msg: >-
      The Sable container is not running with a read-only root filesystem and all capabilities dropped
      (running={{ sable_container.State.Running }},
      read-only={{ sable_container.HostConfig.ReadonlyRootfs }},
      dropped={{ sable_container.HostConfig.CapDrop }})
    success_msg: "The Sable container runs read-only with all capabilities dropped"

# A pulled image carries the version in an OCI label, which is the
# cheapest statement of what is running. The label comes from Sable's
# release workflow rather than from the Dockerfile, so a self-built image
# does not have it and the scenario says so.
- name: Assert the running Sable is the version this role installs
  ansible.builtin.assert:
    that: sable_container.Config.Labels['org.opencontainers.image.version'] == sable_defaults.sable_version
    fail_msg: "Sable reports {{ sable_container.Config.Labels['org.opencontainers.image.version'] | default('none') }}, expected {{ sable_defaults.sable_version }}"
    success_msg: "Sable reports {{ sable_container.Config.Labels['org.opencontainers.image.version'] }}"

# ------------------------------------------------------------------
# What the role's nginx configuration serves
# ------------------------------------------------------------------

# The image's own vhost listens on port 80 and this role's `nginx.conf`
# listens on 8080 so that it can run as a non-root user, and the role's
# file does not include `conf.d`, so the image's vhost is never loaded.
# Anything answering here at all is therefore the role's configuration.
- name: Wait for the Sable page to be served (up to 180s)
  ansible.builtin.uri:
    url: "{{ sable_molecule_base_url }}/"
    method: GET
    # Nothing about a working Sable involves a redirect, so following one
    # could only turn some other response into a misleading 200.
    follow_redirects: none
    status_code: "{{ sable_molecule_http_status_codes }}"
    return_content: true
  register: sable_index
  until: sable_index.status == 200
  retries: 36
  delay: 5

- name: Assert the Sable page is served
  ansible.builtin.assert:
    that:
      - sable_index.status == 200
      - "'<title>Sable Client</title>' in sable_index.content"
    fail_msg: "The Sable page was not served ({{ sable_index.status }})"
    success_msg: "The Sable page is served ({{ sable_index.content | length }} bytes)"

# Sable is a single-page application: every route that is not a real file
# has to come back as `index.html`. That fallback is a rewrite rule in the
# `nginx.conf` this role renders, so a deep route answering with the page
# is this role's routing working, not a static file happening to exist.
- name: Request a Sable route that is not a file on disk
  ansible.builtin.uri:
    url: "{{ sable_molecule_base_url }}/room/!molecule:example.com"
    method: GET
    follow_redirects: none
    status_code: "{{ sable_molecule_http_status_codes }}"
    return_content: true
  register: sable_spa_route
  changed_when: false

- name: Assert Sable routes unknown paths to the application
  ansible.builtin.assert:
    that:
      - sable_spa_route.status == 200
      - "'<title>Sable Client</title>' in sable_spa_route.content"
    fail_msg: "A Sable route was not rewritten to the application ({{ sable_spa_route.status }})"
    success_msg: "Sable routes unknown paths to the application"

- name: Request the Sable web application manifest
  ansible.builtin.uri:
    url: "{{ sable_molecule_base_url }}/manifest.json"
    method: GET
    follow_redirects: none
    status_code: "{{ sable_molecule_http_status_codes }}"
  register: sable_manifest
  changed_when: false

- name: Assert the Sable web application manifest is served
  ansible.builtin.assert:
    that:
      - sable_manifest.status == 200
      - sable_manifest.json.name == 'Sable'
    fail_msg: "The Sable manifest was not served ({{ sable_manifest.status }})"
    success_msg: "The Sable manifest is served"

# ------------------------------------------------------------------
# The configuration this role rendered, as the browser receives it
# ------------------------------------------------------------------

# A bare Sable image ships its own `config.json` at this very path, so the
# request succeeding says nothing about the role. The assertions below are
# what separate the two: the file can only carry these values if the role
# rendered it and the systemd unit mounted it over the image's copy.
- name: Request the Sable configuration
  ansible.builtin.uri:
    url: "{{ sable_molecule_base_url }}/config.json"
    method: GET
    follow_redirects: none
    status_code: "{{ sable_molecule_http_status_codes }}"
  register: sable_served_config
  changed_when: false

- name: Assert the Sable configuration is served
  ansible.builtin.assert:
    that: sable_served_config.status == 200
    fail_msg: "The Sable configuration was not served ({{ sable_served_config.status }})"
    success_msg: "The Sable configuration is served"

- name: Assert the served Sable configuration carries the configured homeserver
  ansible.builtin.assert:
    that:
      - sable_served_config.json.homeserverList == [sable_default_hs_url]
      - sable_served_config.json.defaultHomeserver == 0
    fail_msg: >-
      The served configuration lists {{ sable_served_config.json.homeserverList }} defaulting to
      index {{ sable_served_config.json.defaultHomeserver }}, expected {{ [sable_default_hs_url] }} at index 0
    success_msg: "The served configuration lists only the configured homeserver"

- name: Assert the served Sable configuration carries the configuration extension
  ansible.builtin.assert:
    that:
      - not sable_served_config.json.allowCustomHomeservers
      - sable_served_config.json.hashRouter.enabled
      - sable_served_config.json.hashRouter.basename == '/molecule'
    fail_msg: "The served configuration does not carry the extension: {{ sable_served_config.json }}"
    success_msg: "The served configuration carries the extension, combined into the role's own keys"

- name: Assert the served Sable configuration carries the role's featured communities
  ansible.builtin.assert:
    that:
      - sable_served_config.json.featuredCommunities.spaces == []
      - sable_served_config.json.featuredCommunities.rooms == []
      - sable_served_config.json.featuredCommunities.servers == ['matrix.org']
      - not sable_served_config.json.featuredCommunities.openAsDefault
    fail_msg: "The served configuration does not carry the role's featured communities: {{ sable_served_config.json.featuredCommunities }}"
    success_msg: "The served configuration carries the role's featured communities"

# ------------------------------------------------------------------
# The version of the application that is actually running
# ------------------------------------------------------------------

# Sable builds its own version into its JavaScript bundle, and renders it
# in its about screen. The bundle's filename carries a content hash that
# changes with every release, so the only way to reach it is to read it
# off the page that references it. Unlike the image label, this holds for
# a self-built image too, because the value comes from the sources.
- name: Determine the Sable page module that the page loads
  ansible.builtin.set_fact:
    # `regex_search` with a capture group hands back a list of groups, or
    # nothing at all when the page does not match. Joining covers both.
    sable_bundle_url: "{{ (sable_index.content | regex_search('href=\"(/assets/page-[^\"]+\\.js)\"', '\\1') | default([], true)) | join('') }}"

    # sable_bundle_url: "{{ (sable_index.content | regex_search('src=\"(/assets/index-[^\"]+\\.js)\"', '\\1') | default([], true)) | join('') }}"

- name: Assert the Sable page references an page module
  ansible.builtin.assert:
    that: sable_bundle_url | length > 0
    fail_msg: "The served page references no page module: {{ sable_index.content }}"
    success_msg: "The served page loads its page module from {{ sable_bundle_url }}"

- name: Download the Sable page module
  ansible.builtin.get_url:
    url: "{{ sable_molecule_base_url }}{{ sable_bundle_url }}"
    dest: "{{ sable_molecule_bundle_path }}"
    mode: "0640"
  register: sable_bundle_download

- name: Display the Sable page module
  when: sable_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: "cat {{ sable_molecule_bundle_path }}"
  changed_when: false

# The bundle is several megabytes, so it is searched on the host rather
# than pulled into a variable. Sable renders its version as the text of a
# link to its releases page, which is what this pattern picks up.
- name: Read the version out of the Sable page module
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import re
        import sys

        with open(sys.argv[1], encoding='utf-8', errors='replace') as handle:
            bundle = handle.read()

        matches = re.findall(
            r"build:`v([0-9]+\.[0-9]+\.[0-9]+)",
            bundle,
        )

        print(" ".join(sorted(set(matches))))
      - "{{ sable_molecule_bundle_path }}"
  register: sable_bundle_version
  changed_when: false

# This time the version is checked inside the application that is actually running
- name: Assert the running Sable is the version this role installs
  ansible.builtin.assert:
    that:
      - sable_bundle_version.stdout_lines | length > 0
      - sable_defaults.sable_version in sable_bundle_version.stdout.split()
    fail_msg: "Sable reports {{ sable_bundle_version.stdout | default('none') }}, expected {{ sable_defaults.sable_version }}"
    success_msg: "Sable reports {{ sable_bundle_version.stdout }}"

- name: Verify nothing was quietly restarting while all of that was being checked
  when: "sable_restarts_check_enabled | bool"
  block:
    # `Restart=always` means the unit reads `active` while it is crash-looping,
    # so `active` on its own says very little. The window has to be watched with
    # everything already answering.
    - name: Sample the restart counters
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: sable_restarts_before
      loop: "{{ sable_verify_units }}"

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the services for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the restart counters again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: sable_restarts_after
      loop: "{{ sable_verify_units }}"

    - name: Assert no service restarted while it was up
      ansible.builtin.assert:
        that:
          - sable_restarts_after.results | map(attribute='status.NRestarts') | list == sable_restarts_before.results | map(attribute='status.NRestarts') | list
          - sable_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
        fail_msg: >-
          A service restarted while it was supposedly up, so `active` was hiding a crash loop.
          Before:
          {% for unit, restarts in sable_verify_units | zip(sable_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
          after:
          {% for unit, restarts in sable_verify_units | zip(sable_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
        success_msg: >-
          None of the services restarted over 45 seconds of watching (restarts so far:
          {% for unit, restarts in sable_verify_units | zip(sable_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

- name: Show the Sable verification summary
  ansible.builtin.debug:
    msg:
      - "Sable systemd: {% for unit, state in sable_verify_units | zip(sable_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
      - "Sable restarts: {% for unit, restarts in sable_verify_units | zip(sable_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
      - "Sable container user: {{ sable_container.Config.User }}"
      - "Sable running version: {{ sable_bundle_version.stdout }}"
      - "Sable page size: {{ sable_index.content | length }} bytes"
      - "Sable bundle: {{ sable_bundle_url }} ({{ sable_bundle_download.size | default('unknown') }} bytes)"
      - "Sable homeservers served: {{ sable_served_config.json.homeserverList }}"
