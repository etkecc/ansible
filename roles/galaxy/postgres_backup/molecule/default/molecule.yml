---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: postgres-backup-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        postgres_backup_debug_service_enabled: false

        # The database that this scenario creates, fills with a distinctive row
        # and then expects to find inside a dump.
        postgres_backup_molecule_database_name: molecule
        postgres_backup_molecule_database_username: molecule_username
        postgres_backup_molecule_database_password: molecule_password
        postgres_backup_molecule_table_name: molecule_probe
        postgres_backup_molecule_canary: molecule-postgres-backup-canary-4f2a91

        # The port on the host that the container's healthcheck endpoint is
        # published on. The role itself does not publish it, so the scenario
        # does that below via `postgres_backup_container_extra_arguments_custom`.
        # It is how `verify.yml` learns whether a backup run succeeded.
        postgres_backup_molecule_healthcheck_bind_port: 18080

        # Variables for postgres-backup-local
        #
        # The wiring below mirrors how mash-playbook connects this role to
        # ansible-role-postgres: the backup container joins Postgres' own
        # container network, connects as the Postgres superuser and backs up
        # every database that ansible-role-postgres manages.
        postgres_backup_uid: 1000
        postgres_backup_gid: 1000
        postgres_backup_container_network: "{{ postgres_container_network }}"
        postgres_backup_connection_hostname: "{{ postgres_connection_hostname }}"
        postgres_backup_connection_port: "{{ postgres_connection_port }}"
        postgres_backup_connection_username: "{{ postgres_connection_username }}"
        postgres_backup_connection_password: "{{ postgres_connection_password }}"
        postgres_backup_databases_auto: "{{ postgres_managed_databases | map(attribute='name') | list }}"
        postgres_backup_postgres_data_path: "{{ postgres_data_path }}"
        postgres_backup_postgres_role_include_name: ansible-role-postgres
        postgres_backup_systemd_required_services_list_custom:
          - "{{ postgres_identifier }}.service"

        # Pinned to literal values, because `verify.yml` runs as a separate
        # play - role defaults are out of scope there, and these two are
        # derived from other variables rather than being literals themselves.
        postgres_backup_base_path: /postgres-backup
        postgres_backup_config_path: /postgres-backup/config
        postgres_backup_data_path: /postgres-backup/data

        # Deliberately different from both the role defaults and the container
        # image's own defaults, so that `verify.yml` can tell that these knobs
        # are what actually reached the container rather than something that
        # happened to agree with them.
        postgres_backup_schedule: "@weekly"
        postgres_backup_keep_days: 3
        postgres_backup_keep_weeks: 2
        postgres_backup_keep_mins: 120
        postgres_backup_keep_months: 5

        # `BACKUP_ON_START` makes the container's scheduler run one backup as
        # soon as it starts, through the very same code path that a scheduled
        # run goes through. Without it, the first backup would only happen at
        # the next `SCHEDULE` occurrence, which is far too late for a test.
        postgres_backup_environment_variables_additional_variables: |
          BACKUP_ON_START=TRUE

        postgres_backup_container_extra_arguments_custom:
          - "-p 127.0.0.1:{{ postgres_backup_molecule_healthcheck_bind_port }}:{{ postgres_backup_healthcheck_port }}"

        # Variables for Postgres
        #
        # `postgres_identifier` is pinned to its own default value so that later
        # plays and `verify.yml`, where the Postgres role's defaults are out of
        # scope, can still address the container and the service by name.
        postgres_identifier: postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_managed_databases:
          - name: "{{ postgres_backup_molecule_database_name }}"
            username: "{{ postgres_backup_molecule_database_username }}"
            password: "{{ postgres_backup_molecule_database_password }}"
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
