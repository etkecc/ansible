---
- name: Ensure Matrix.to path exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ matrixto_uid }}"
    group: "{{ matrixto_gid }}"
  with_items:
    - "{{ matrixto_base_path }}"

- name: Ensure Matrix.to support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ matrixto_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ matrixto_uid }}"
    group: "{{ matrixto_gid }}"
  with_items:
    - env
    - labels
  register: matrixto_support_files_result

# A checkout owned by a different user (a uid change, an earlier clone by another user, etc.) would make the git task below fail on ownership or permissions.
- name: Ensure Matrix.to repository ownership is correct on self-build
  ansible.builtin.file:
    path: "{{ matrixto_container_image_self_build_src_files_path }}"
    state: directory
    owner: "{{ matrixto_uid }}"
    group: "{{ matrixto_gid }}"
    recurse: true

- name: Ensure Matrix.to repository is present on self-build
  ansible.builtin.git:
    repo: "{{ matrixto_container_image_self_build_repo }}"
    version: "{{ matrixto_container_image_self_build_repo_version }}"
    dest: "{{ matrixto_container_image_self_build_src_files_path }}"
    force: "yes"
  # Keep this even though the task above normalizes ownership. Git may still see an ownership mismatch when Ansible becomes an unprivileged user (see #5065).
  environment:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "{{ matrixto_container_image_self_build_src_files_path }}"
  register: matrixto_git_pull_results

- name: Ensure Matrix.to files for building container image installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ matrixto_container_image_self_build_src_files_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ matrixto_uid }}"
    group: "{{ matrixto_gid }}"
  with_items:
    - Dockerfile
  register: matrixto_container_image_self_build_src_files_result

- name: Check if Matrix.to container image exists
  ansible.builtin.command: docker images -q "{{ matrixto_container_image_self_build_name }}"
  register: matrixto_docker_image_exists
  changed_when: false

- name: Ensure Matrix.to container image is built if the container image does not exist or the repository has been updated
  community.docker.docker_image_build:
    name: "{{ matrixto_container_image_self_build_name }}"
    dockerfile: Dockerfile
    path: "{{ matrixto_container_image_self_build_src_files_path }}"
    pull: true
    rebuild: >-
      {{
        'always' if
          matrixto_docker_image_exists.stdout == ''
          or matrixto_git_pull_results.changed | default(false)
          or matrixto_container_image_self_build_src_files_result.changed | default(false)
        else 'never'
      }}
  register: matrixto_container_image_build_result

- name: Ensure Matrix.to container network is created via community.docker.docker_network
  when:
    - devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
    - matrixto_container_network != 'host'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ matrixto_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: matrixto_network_creation_result

- name: Ensure Matrix.to container network is created via ansible.builtin.command
  when:
    - devture_systemd_docker_base_container_network_creation_method == 'command'
    - matrixto_container_network != 'host'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ matrixto_container_network }}
  register: matrixto_network_creation_result
  changed_when: matrixto_network_creation_result.rc == 0
  failed_when: matrixto_network_creation_result.rc != 0 and 'already exists' not in matrixto_network_creation_result.stderr

- name: Ensure Matrix.to systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/matrixto.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ matrixto_identifier }}.service"
    mode: "0644"
  register: matrixto_systemd_service_result

- name: Determine whether the Matrix.to container is stale
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/util/determine_container_staleness.yml"

- name: Determine whether Matrix.to needs a restart
  ansible.builtin.set_fact:
    matrixto_restart_necessary: >-
      {{
        matrixto_support_files_result.changed | default(false)
        or matrixto_systemd_service_result.changed | default(false)
        or matrixto_container_image_build_result.changed | default(false)
        or matrixto_container_stale | bool
      }}
