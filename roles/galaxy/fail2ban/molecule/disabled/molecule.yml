---
driver:
  name: docker
platforms:
  - name: fail2ban-${MOLECULE_DISTRO:-ubuntu2604}-disabled
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # The one thing this scenario is about.
        system_security_fail2ban_enabled: false

        # Values the role would happily write into jail.local if the switch
        # above were not honored. They are deliberately different from the
        # role's defaults, so that a jail.local produced by an unguarded role
        # could not be mistaken for the file prepare.yml left behind.
        system_security_fail2ban_sshd_port: 2222
        system_security_fail2ban_ignoreip: "127.0.0.1/8 ::1 10.77.77.77"

        # prepare.yml writes this into /etc/fail2ban/jail.local and verify.yml
        # requires it to still be there, byte for byte, afterwards.
        fail2ban_molecule_sentinel_jail_local: |
          # Written by the Molecule scenario. The role must not touch this file
          # while system_security_fail2ban_enabled is false.
          [DEFAULT]
          ignoreip = 203.0.113.7
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
