---
- name: Include roles for fail2ban Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for fail2ban Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name
