---
- name: Verify Valkey
  hosts: all
  become: true
  gather_facts: false

  vars:
    valkey_verify_units:
      - valkey.service

  tasks:
    - name: Verify that Valkey works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: valkey_defaults

        - name: Wait for the Valkey systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: valkey_services
          until: valkey_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ valkey_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Valkey systemd services are active
          ansible.builtin.assert:
            that: valkey_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(valkey_verify_units | zip(valkey_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Valkey systemd services log for debugging
          when: valkey_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ valkey_verify_units }}"

        # A systemd unit reaching "active" only means that `docker start` has not
        # exited yet. PING is the cheapest answer the server itself can give, so it
        # is the first thing here that proves a usable Valkey rather than merely a
        # running process.
        #
        # community.docker is deliberately avoided throughout this playbook: the
        # linting environment in CI has no collections installed.
        - name: Wait for Valkey to answer PING over TCP (up to 120s)
          ansible.builtin.command:
            cmd: >-
              docker exec valkey
              valkey-cli -a {{ valkey_connection_password }} --no-auth-warning PING
          register: valkey_ping_tcp
          changed_when: false
          until: valkey_ping_tcp.rc == 0 and valkey_ping_tcp.stdout is search('PONG')
          retries: 24
          delay: 5

        - name: Assert Valkey answers PING over TCP
          ansible.builtin.assert:
            that: valkey_ping_tcp.stdout is search('PONG')
            fail_msg: "Valkey did not answer PING over TCP: {{ valkey_ping_tcp.stdout | default('no output') }}"
            success_msg: "Valkey answers PING over TCP"

        - name: Query the version of the running Valkey
          ansible.builtin.command:
            cmd: >-
              docker exec valkey
              valkey-cli -a {{ valkey_connection_password }} --no-auth-warning
              INFO server
          register: valkey_info_server
          changed_when: false

        - name: Determine the version of the running Valkey
          ansible.builtin.set_fact:
            valkey_reported_version: "{{ (valkey_info_server.stdout | regex_search('valkey_version:([^\\r\\n]+)', '\\1') | first) | trim }}"

        - name: Assert the running Valkey is the version this role installs
          ansible.builtin.assert:
            that: valkey_reported_version.startswith(valkey_defaults.valkey_version | string)
            fail_msg: "Valkey reports {{ valkey_reported_version | default('none') }}, expected {{ valkey_defaults.valkey_version }}"
            success_msg: "Valkey reports {{ valkey_reported_version }}"

        # Consumers of this role talk to Valkey over the UNIX socket that the role
        # asks for in valkey.conf, not over TCP, so the socket listener is the path
        # that actually matters and is worth probing separately.
        - name: Ping Valkey over its UNIX socket
          ansible.builtin.command:
            cmd: >-
              docker exec valkey
              valkey-cli -s /run/valkey/valkey.sock
              -a {{ valkey_connection_password }} --no-auth-warning PING
          register: valkey_ping_socket
          changed_when: false

        - name: Assert Valkey answers PING over its UNIX socket
          ansible.builtin.assert:
            that: valkey_ping_socket.stdout is search('PONG')
            fail_msg: "Valkey did not answer PING over its UNIX socket: {{ valkey_ping_socket.stdout | default('no output') }}"
            success_msg: "Valkey answers PING over its UNIX socket"

        # This scenario sets a connection password, so an unauthenticated client
        # must be turned away. Without this probe, the `requirepass` branch of
        # valkey.conf.j2 could stop being rendered and everything else here would
        # still pass.
        - name: Ping Valkey without authenticating
          ansible.builtin.command:
            cmd: "docker exec valkey valkey-cli PING"
          register: valkey_ping_unauthenticated
          changed_when: false
          failed_when: false

        - name: Assert Valkey rejects unauthenticated clients
          ansible.builtin.assert:
            that: (valkey_ping_unauthenticated.stdout + valkey_ping_unauthenticated.stderr) is search('NOAUTH')
            fail_msg: >-
              Valkey did not reject an unauthenticated client:
              {{ valkey_ping_unauthenticated.stdout | default('no output') }}
            success_msg: "Valkey rejects unauthenticated clients"

        # A write and a read back through a separate connection, which covers the
        # whole path (client -> server -> keyspace) in both directions rather than
        # just the fact that the server accepts connections.
        - name: Write a key to Valkey
          ansible.builtin.command:
            cmd: >-
              docker exec valkey
              valkey-cli -a {{ valkey_connection_password }} --no-auth-warning
              SET molecule-key molecule-value
          register: valkey_set
          changed_when: true

        - name: Read the key back from Valkey
          ansible.builtin.command:
            cmd: >-
              docker exec valkey
              valkey-cli -a {{ valkey_connection_password }} --no-auth-warning
              GET molecule-key
          register: valkey_get
          changed_when: false

        - name: Assert the key was stored and read back
          ansible.builtin.assert:
            that:
              - valkey_set.stdout is search('OK')
              - valkey_get.stdout is search('molecule-value')
            fail_msg: "A SET/GET round-trip failed (SET: {{ valkey_set.stdout }}, GET: {{ valkey_get.stdout }})"
            success_msg: "A SET/GET round-trip works"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "valkey_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: valkey_restarts_before
              loop: "{{ valkey_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: valkey_restarts_after
              loop: "{{ valkey_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - valkey_restarts_after.results | map(attribute='status.NRestarts') | list == valkey_restarts_before.results | map(attribute='status.NRestarts') | list
                  - valkey_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in valkey_verify_units | zip(valkey_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in valkey_verify_units | zip(valkey_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in valkey_verify_units | zip(valkey_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Valkey verification summary
          ansible.builtin.debug:
            msg:
              - "Valkey systemd: {% for unit, state in valkey_verify_units | zip(valkey_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Valkey restarts: {% for unit, restarts in valkey_verify_units | zip(valkey_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Valkey version: {{ valkey_reported_version }}"
              - "Valkey PING over TCP: {{ valkey_ping_tcp.stdout }}"
              - "Valkey PING over UNIX socket: {{ valkey_ping_socket.stdout }}"
              - "Valkey SET/GET round-trip: {{ valkey_get.stdout }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Valkey systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=valkey.service
          register: valkey_service_log
          changed_when: false

        - name: Show the Valkey systemd service log
          ansible.builtin.debug:
            var: valkey_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Valkey verification failed. The systemd service log is printed above."
