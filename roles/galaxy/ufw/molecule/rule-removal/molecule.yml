---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  # See the note in molecule/default/molecule.yml about why running this
  # against a container - and never against the test machine - is what keeps
  # the host's own firewall out of it.
  - name: ufw-${MOLECULE_DISTRO:-ubuntu2604}-rule-removal
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # prepare.yml opens 2222/tcp before the role runs. With
        # `system_security_ufw_ssh_allowed` off, the role has to close it
        # again - the behavior an operator relies on when they restrict SSH
        # to a handful of source addresses through their own rules.
        system_security_ssh_port: 2222
        system_security_ufw_ssh_allowed: false

        # prepare.yml also opens 19999/tcp. This entry retires it.
        system_security_ufw_rules_custom:
          - name: Molecule retired rule
            rule: allow
            port: "19999"
            proto: tcp
            delete: true
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
