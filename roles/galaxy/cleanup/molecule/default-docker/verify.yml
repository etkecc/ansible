# Verifies what `system_cleanup_docker` does to a Docker daemon.
#
# This is the destructive half of the role, so the suite is written around the
# line between what it removes and what it must not touch. prepare.yml seeded
# both sides of that line into an empty daemon; each assertion below names which
# side its object is on and why.
#
# Everything goes through the `docker` CLI rather than `community.docker.*`,
# and through `docker ... inspect` rather than `--format`, so that neither the
# linting environment nor Jinja has to be argued with.

---
- name: Verify the Docker pruning of the cleanup role
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify that the cleanup role works
      block:
        - name: Read the identifier of the anonymous volume prepare.yml left behind
          ansible.builtin.slurp:
            src: "{{ cleanup_molecule_anonymous_volume_file }}"
          register: cleanup_molecule_anonymous_volume_slurp

        - name: Look for every Docker object the role had an opinion about
          ansible.builtin.command:
            cmd: "{{ item }}"
          register: cleanup_molecule_docker_after
          changed_when: false
          failed_when: false
          vars:
            cleanup_molecule_anonymous_volume: "{{ cleanup_molecule_anonymous_volume_slurp.content | b64decode | trim }}"
          loop:
            - "docker container inspect {{ cleanup_molecule_running_container }}"
            - "docker container inspect {{ cleanup_molecule_exited_container }}"
            - "docker image inspect {{ cleanup_molecule_docker_image }}"
            - "docker image inspect {{ cleanup_molecule_unused_image }}"
            - "docker image inspect {{ cleanup_molecule_superseded_image }}"
            - "docker image inspect {{ cleanup_molecule_superseding_image }}"
            - "docker volume inspect {{ cleanup_molecule_used_volume }}"
            - "docker volume inspect {{ cleanup_molecule_named_volume }}"
            - "docker volume inspect {{ cleanup_molecule_anonymous_volume }}"
            - "docker network inspect {{ cleanup_molecule_network }}"

        # The list of `docker ... inspect` invocations that found their object.
        # Membership in it is what every assertion below is phrased in terms of.
        - name: Look for the Docker cleanup script
          ansible.builtin.stat:
            path: /srv/molecule-cleanup/bin/cleanup-docker
          register: cleanup_molecule_docker_script

        - name: Assert that the Docker cleanup script is installed under the configured base path
          ansible.builtin.assert:
            that:
              - cleanup_molecule_docker_script.stat.exists
              - cleanup_molecule_docker_script.stat.executable
            fail_msg: >-
              /srv/molecule-cleanup/bin/cleanup-docker is missing or not executable, although
              `system_cleanup_base_path` is /srv/molecule-cleanup
            success_msg: "/srv/molecule-cleanup/bin/cleanup-docker is installed"

        - name: Read how systemd parsed the Docker cleanup timer and service
          ansible.builtin.command:
            cmd: "systemctl show {{ item.unit }} --property={{ item.property }} --value"
          register: cleanup_molecule_docker_units
          changed_when: false
          loop:
            - {unit: molecule-cleanup-docker.timer, property: UnitFileState}
            - {unit: molecule-cleanup-docker.timer, property: ActiveState}
            - {unit: molecule-cleanup-docker.timer, property: TimersCalendar}
            - {unit: molecule-cleanup-docker.service, property: ExecStart}
            - {unit: molecule-cleanup-docker.service, property: Requires}
            - {unit: molecule-cleanup-docker.service, property: After}
          loop_control:
            label: "{{ item.unit }} {{ item.property }}"

        - name: Assert that the timer is enabled and active, and that the service runs the script after Docker
          ansible.builtin.assert:
            that:
              - cleanup_molecule_docker_units.results[0].stdout == 'enabled'
              - cleanup_molecule_docker_units.results[1].stdout == 'active'
              - "'03:22:44' in cleanup_molecule_docker_units.results[2].stdout"
              - "'path=/srv/molecule-cleanup/bin/cleanup-docker ' in cleanup_molecule_docker_units.results[3].stdout"
              - "'docker.service' in cleanup_molecule_docker_units.results[4].stdout.split()"
              - "'docker.service' in cleanup_molecule_docker_units.results[5].stdout.split()"
            fail_msg: "systemd reports {{ cleanup_molecule_docker_units.results | map(attribute='stdout') | list }}"
            success_msg: "The timer is enabled and active, on this scenario's schedule, and the service runs after Docker"

        - name: Index which of those commands found their object
          ansible.builtin.set_fact:
            cleanup_molecule_found: "{{ cleanup_molecule_docker_after.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

        ########################################################################
        #                                                                      #
        # what `docker container prune -f` removed                             #
        #                                                                      #
        ########################################################################

        - name: Assert that the stopped container was pruned and the running one was not
          vars:
            cleanup_molecule_running_key: "docker container inspect {{ cleanup_molecule_running_container }}"
            cleanup_molecule_exited_key: "docker container inspect {{ cleanup_molecule_exited_container }}"
          ansible.builtin.assert:
            that:
              - cleanup_molecule_exited_key not in cleanup_molecule_found
              - cleanup_molecule_running_key in cleanup_molecule_found
            fail_msg: >-
              The stopped container {{ cleanup_molecule_exited_container }} is
              {{ 'still there' if cleanup_molecule_exited_key in cleanup_molecule_found else 'gone' }}
              and the running container {{ cleanup_molecule_running_container }} is
              {{ 'still there' if cleanup_molecule_running_key in cleanup_molecule_found else 'gone' }}.
              `docker container prune -f` must remove the first and keep the second.
            success_msg: >-
              {{ cleanup_molecule_exited_container }} was pruned and
              {{ cleanup_molecule_running_container }} was left alone

        # The container is not merely still listed - it is still running, and
        # `docker exec` is the cheapest thing that can only succeed if it is.
        - name: Run a command inside the container that survived
          ansible.builtin.command:
            cmd: "docker exec {{ cleanup_molecule_running_container }} /bin/true"
          register: cleanup_molecule_docker_exec
          changed_when: false
          failed_when: false

        - name: Assert that the container that survived is still running
          ansible.builtin.assert:
            that: cleanup_molecule_docker_exec.rc == 0
            fail_msg: >-
              `docker exec` into {{ cleanup_molecule_running_container }} failed with
              {{ cleanup_molecule_docker_exec.rc }}: {{ cleanup_molecule_docker_exec.stderr }}
            success_msg: "{{ cleanup_molecule_running_container }} is still running"

        ########################################################################
        #                                                                      #
        # which images were removed                                            #
        #                                                                      #
        ########################################################################

        # Only the image which is unused *and* superseded by a newer image of
        # its repository goes. The unused image with no newer version is what
        # sets this apart from `docker image prune -a`, which would take it: it
        # stands for the image of a stopped service or of a container that only
        # runs on a timer.
        - name: Assert that only the superseded image was removed
          vars:
            cleanup_molecule_used_image_key: "docker image inspect {{ cleanup_molecule_docker_image }}"
            cleanup_molecule_unused_image_key: "docker image inspect {{ cleanup_molecule_unused_image }}"
            cleanup_molecule_superseded_image_key: "docker image inspect {{ cleanup_molecule_superseded_image }}"
            cleanup_molecule_superseding_image_key: "docker image inspect {{ cleanup_molecule_superseding_image }}"
          ansible.builtin.assert:
            that:
              - cleanup_molecule_superseded_image_key not in cleanup_molecule_found
              - cleanup_molecule_superseding_image_key in cleanup_molecule_found
              - cleanup_molecule_unused_image_key in cleanup_molecule_found
              - cleanup_molecule_used_image_key in cleanup_molecule_found
            fail_msg: >-
              The superseded image {{ cleanup_molecule_superseded_image }} is
              {{ 'still there' if cleanup_molecule_superseded_image_key in cleanup_molecule_found else 'gone' }},
              the newer {{ cleanup_molecule_superseding_image }} is
              {{ 'still there' if cleanup_molecule_superseding_image_key in cleanup_molecule_found else 'gone' }},
              the unused image without a newer version {{ cleanup_molecule_unused_image }} is
              {{ 'still there' if cleanup_molecule_unused_image_key in cleanup_molecule_found else 'gone' }}
              and the image in use {{ cleanup_molecule_docker_image }} is
              {{ 'still there' if cleanup_molecule_used_image_key in cleanup_molecule_found else 'gone' }}.
              Only the first should be gone.
            success_msg: >-
              {{ cleanup_molecule_superseded_image }} was removed; {{ cleanup_molecule_superseding_image }},
              {{ cleanup_molecule_unused_image }} and {{ cleanup_molecule_docker_image }} were left alone

        ########################################################################
        #                                                                      #
        # what `docker volume prune -f` removed                                #
        #                                                                      #
        ########################################################################

        # Since Docker 23, `docker volume prune` without `--all` removes only
        # anonymous volumes; a named volume that nothing uses is left where it
        # is. The role passes no `--all`, so that is the behavior asserted here -
        # deliberately, because a named volume is where a self-hosted service
        # keeps its data, and reaping those on a housekeeping run would be
        # catastrophic. Should a future Docker change this, or should the role
        # ever grow an `-a`, this is the assertion that fails.
        - name: Assert that only the anonymous volume was pruned
          vars:
            cleanup_molecule_anonymous_volume: "{{ cleanup_molecule_anonymous_volume_slurp.content | b64decode | trim }}"
            cleanup_molecule_anonymous_key: "docker volume inspect {{ cleanup_molecule_anonymous_volume }}"
            cleanup_molecule_named_key: "docker volume inspect {{ cleanup_molecule_named_volume }}"
            cleanup_molecule_used_key: "docker volume inspect {{ cleanup_molecule_used_volume }}"
          ansible.builtin.assert:
            that:
              - cleanup_molecule_anonymous_key not in cleanup_molecule_found
              - cleanup_molecule_named_key in cleanup_molecule_found
              - cleanup_molecule_used_key in cleanup_molecule_found
            fail_msg: >-
              The dangling anonymous volume {{ cleanup_molecule_anonymous_volume }} is
              {{ 'still there' if cleanup_molecule_anonymous_key in cleanup_molecule_found else 'gone' }},
              the unused named volume {{ cleanup_molecule_named_volume }} is
              {{ 'still there' if cleanup_molecule_named_key in cleanup_molecule_found else 'gone' }}
              and the named volume in use {{ cleanup_molecule_used_volume }} is
              {{ 'still there' if cleanup_molecule_used_key in cleanup_molecule_found else 'gone' }}.
              `docker volume prune -f` removes anonymous volumes only.
            success_msg: >-
              The anonymous volume was pruned; the named volumes
              {{ cleanup_molecule_named_volume }} and {{ cleanup_molecule_used_volume }} were left
              alone, as `docker volume prune` without `--all` should

        - name: Read the marker out of the volume that is in use
          ansible.builtin.command:
            cmd: "docker exec {{ cleanup_molecule_running_container }} /bin/cat /data/marker"
          register: cleanup_molecule_docker_volume_marker
          changed_when: false

        # Surviving as an object is not the same as surviving with its contents.
        - name: Assert that the data in the volume in use survived
          ansible.builtin.assert:
            that: cleanup_molecule_docker_volume_marker.stdout == cleanup_molecule_volume_marker
            fail_msg: >-
              /data/marker in {{ cleanup_molecule_used_volume }} reads
              '{{ cleanup_molecule_docker_volume_marker.stdout }}' rather than
              '{{ cleanup_molecule_volume_marker }}'
            success_msg: "{{ cleanup_molecule_used_volume }} still holds what was written to it"

        ########################################################################
        #                                                                      #
        # what the role does not prune at all                                  #
        #                                                                      #
        ########################################################################

        # defaults/main.yml promises that networks are preserved, and the role
        # keeps that promise by not running `docker network prune`. The network
        # seeded here is attached to nothing, so a prune would take it.
        - name: Assert that the unattached network was preserved
          vars:
            cleanup_molecule_network_key: "docker network inspect {{ cleanup_molecule_network }}"
          ansible.builtin.assert:
            that: cleanup_molecule_network_key in cleanup_molecule_found
            fail_msg: >-
              The network {{ cleanup_molecule_network }} is gone. Nothing was attached to it, so a
              `docker network prune` would have removed it - and defaults/main.yml promises networks
              are preserved.
            success_msg: "{{ cleanup_molecule_network }} is still there, as promised"

        ########################################################################
        #                                                                      #
        # the journald autovacuum units were uninstalled                       #
        #                                                                      #
        ########################################################################

        # prepare.yml installed, enabled and started stand-ins for these, and
        # `system_cleanup_logs` is off in this scenario.
        - name: Look for the journald autovacuum unit files and the timer's enablement symlink
          ansible.builtin.stat:
            path: "{{ item }}"
          register: cleanup_molecule_logs_files
          loop:
            - /etc/systemd/system/systemd-journald-autovacuum.service
            - /etc/systemd/system/systemd-journald-autovacuum.timer
            - /etc/systemd/system/timers.target.wants/systemd-journald-autovacuum.timer

        - name: Read the state of the journald autovacuum timer
          ansible.builtin.command:
            cmd: systemctl show systemd-journald-autovacuum.timer --property=ActiveState --value
          register: cleanup_molecule_logs_timer_state
          changed_when: false

        - name: Assert that the journald autovacuum units were stopped, disabled and removed
          ansible.builtin.assert:
            that:
              - cleanup_molecule_logs_files.results | selectattr('stat.exists') | list | length == 0
              - cleanup_molecule_logs_timer_state.stdout == 'inactive'
            fail_msg: >-
              Still present: {{ cleanup_molecule_logs_files.results | selectattr('stat.exists') | map(attribute='item') | list }};
              the timer is {{ cleanup_molecule_logs_timer_state.stdout }}. With `system_cleanup_logs` off,
              the role should have stopped, disabled and removed the units.
            success_msg: "The journald autovacuum units were stopped, disabled and removed"

        - name: Look for purge-old-kernels
          ansible.builtin.stat:
            path: "{{ item }}"
          register: cleanup_molecule_kernels_scripts
          loop:
            - /srv/molecule-cleanup/bin/purge-old-kernels
            - /usr/local/bin/purge-old-kernels

        # prepare.yml installed stand-ins at the role's default path and where
        # earlier versions of the role installed it, and `system_cleanup_kernels`
        # is off in this scenario.
        - name: Assert that purge-old-kernels was removed from both paths
          ansible.builtin.assert:
            that: cleanup_molecule_kernels_scripts.results | selectattr('stat.exists') | list | length == 0
            fail_msg: >-
              Still present: {{ cleanup_molecule_kernels_scripts.results | selectattr('stat.exists') | map(attribute='item') | list }}.
              With `system_cleanup_kernels` off, the role should have removed it from its path, and it always
              removes it from where earlier versions of the role installed it.
            success_msg: "purge-old-kernels was removed from both paths"

        - name: Show the Cleanup verification summary
          vars:
            cleanup_molecule_anonymous_volume: "{{ cleanup_molecule_anonymous_volume_slurp.content | b64decode | trim }}"
          ansible.builtin.debug:
            msg:
              - "pruned: container {{ cleanup_molecule_exited_container }}, image {{ cleanup_molecule_superseded_image }}, anonymous volume {{ cleanup_molecule_anonymous_volume }}"
              - "kept: container {{ cleanup_molecule_running_container }} (running), images {{ cleanup_molecule_docker_image }} (in use), {{ cleanup_molecule_superseding_image }} (newest) and {{ cleanup_molecule_unused_image }} (no newer version)"
              - "kept: volumes {{ cleanup_molecule_used_volume }} (with its contents) and {{ cleanup_molecule_named_volume }}"
              - "kept: network {{ cleanup_molecule_network }}"
              - "uninstalled: the journald autovacuum units and purge-old-kernels"

      rescue:
        - name: Retrieve what the Docker daemon holds
          ansible.builtin.command:
            cmd: "{{ item }}"
          register: cleanup_molecule_docker_dump
          changed_when: false
          failed_when: false
          loop:
            - docker ps -a
            - docker images -a
            - docker volume ls
            - docker network ls

        - name: Show what the Docker daemon holds
          ansible.builtin.debug:
            msg: "{{ item.item }}: {{ item.stdout_lines }}"
          loop: "{{ cleanup_molecule_docker_dump.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Cleanup Docker verification failed. The state of the daemon is printed above."
