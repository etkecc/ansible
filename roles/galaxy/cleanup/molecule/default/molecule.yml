---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: cleanup-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  options:
    # The role's Docker pruning is tagged 'start'. Skipping that tag models a
    # run without it (like `--tags=setup-all`), while every untagged task in
    # every playbook of this scenario still runs.
    skip-tags: start
  inventory:
    group_vars:
      all:
        # Every value below is deliberately different from the role's own
        # default, so that verify.yml can tell a value the role rendered from
        # this scenario's variables apart from one that merely looks right.

        # On, which is also the role's default, because this scenario asserts
        # what the journald autovacuum units look like. The default-docker
        # scenario turns it off and asserts that the units are removed.
        system_cleanup_logs: true

        # The role's default is 7d.
        system_cleanup_logs_retention: 3d
        # The role's default is "*-*-* 04:15:00".
        system_cleanup_logs_calendar: "*-*-* 03:17:42"

        # Two of the four paths prepare.yml seeds. The other two are not listed
        # here and have to survive; they are what makes the removal assertion
        # mean something.
        system_cleanup_paths:
          - /var/lib/molecule-cleanup/removed-file
          - /var/lib/molecule-cleanup/removed-directory

        # Turned on although no Docker is installed on this host. The role's
        # Docker pruning is tagged 'start', and this scenario skips that tag.
        # If that gate ever stopped working,
        # `docker container prune` would run and the converge would fail with
        # "docker: command not found" - which is the point of leaving it on.
        # The default-docker scenario covers the pruning itself.
        system_cleanup_docker: true

        # Left off (the role's default). prepare.yml installs and enables
        # stand-ins for the Docker cleanup's systemd units, and verify.yml
        # asserts that the role removed them.
        system_cleanup_docker_timer_enabled: false

        system_cleanup_apt: true
        # An apt "safe" upgrade would download whatever the distribution has
        # published since the test image was built, which is slow, variable and
        # tells us nothing about the role. "no" keeps the first task of
        # tasks/run_apt.yml cheap while the second one - clean, autoclean,
        # autoremove - still does its work, which is what verify.yml checks.
        system_cleanup_apt_upgrade_type: "no"

        system_cleanup_kernels: true
        # The role's default is under `system_cleanup_bin_path`. verify.yml
        # asserts the script is at the path named here and that nothing was
        # written to the default path.
        system_cleanup_kernels_script: /usr/local/bin/molecule-purge-old-kernels
        # The role's default is 1.
        system_cleanup_kernels_keep: 3

        # Variables for the verification suite
        cleanup_molecule_seed_directory: /var/lib/molecule-cleanup
        cleanup_molecule_removed_paths:
          - /var/lib/molecule-cleanup/removed-file
          - /var/lib/molecule-cleanup/removed-directory
          - /var/lib/molecule-cleanup/removed-directory/marker
        cleanup_molecule_kept_paths:
          - /var/lib/molecule-cleanup/kept-file
          - /var/lib/molecule-cleanup/kept-directory
          - /var/lib/molecule-cleanup/kept-directory/marker
        cleanup_molecule_seeded_deb: /var/cache/apt/archives/molecule-cleanup-seeded_1.0_all.deb
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # The stock sequence without `idempotence`. This role is not idempotent and is
  # not meant to be: `tasks/install_logs.yml` starts a `Type=oneshot` unit, which has
  # gone back to inactive by the time the next run looks at it and so is started
  # again, and the pruning and package-manager tasks are unconditional commands.
  # Running housekeeping is the point; reporting no change would mean it had not
  # run.
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: ansible
