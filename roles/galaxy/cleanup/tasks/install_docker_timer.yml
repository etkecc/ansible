---
- name: Ensure the Docker cleanup systemd units are installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ system_cleanup_identifier }}-{{ item }}"
    mode: "0644"
  with_items:
    - docker.service
    - docker.timer

- name: Ensure the Docker cleanup timer is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ system_cleanup_identifier }}-docker.timer"
    enabled: true
    state: started
    daemon_reload: true
