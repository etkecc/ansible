---
- name: Perform cleanup installation tasks
  tags:
    - setup-all
    - setup-cleanup
    - install-all
    - install-cleanup
  block:
    - name: Install systemd-journald-autovacuum
      when: system_cleanup_logs | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install_logs.yml"

    - name: Remove purge-old-kernels from where earlier versions of this role installed it
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/migrate_kernels_script.yml"

    - name: Install purge-old-kernels
      when: system_cleanup_kernels | bool and ansible_facts['os_family'] == "Debian"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install_kernels.yml"

    - name: Install the Docker cleanup
      when: system_cleanup_docker | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install_docker.yml"

    - name: Install the Docker cleanup timer
      when: system_cleanup_docker | bool and system_cleanup_docker_timer_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install_docker_timer.yml"

- name: Perform cleanup uninstallation tasks
  tags:
    - setup-all
    - setup-cleanup
  block:
    - name: Uninstall systemd-journald-autovacuum
      when: not system_cleanup_logs | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall_logs.yml"

    - name: Uninstall purge-old-kernels
      when: not system_cleanup_kernels | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall_kernels.yml"

    - name: Uninstall the Docker cleanup timer
      when: not (system_cleanup_docker | bool and system_cleanup_docker_timer_enabled | bool)
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall_docker_timer.yml"

    - name: Uninstall the Docker cleanup
      when: not system_cleanup_docker | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall_docker.yml"

- name: Perform cleanup tasks
  tags:
    - setup-all
    - setup-cleanup
    - install-cleanup
  block:
    - name: Remove paths
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_paths.yml"

    - name: Upgrade packages and clean up the package manager
      when: system_cleanup_apt | bool and ansible_facts['os_family'] == "Debian"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_apt.yml"

    - name: Purge old kernels
      when: system_cleanup_kernels | bool and ansible_facts['os_family'] == "Debian"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_kernels.yml"

# The Docker cleanup is wired to the `start` tag, which is also what (re)starts services.
# It relies on the services' containers to tell which images are still in use.
- name: Perform cleanup tasks on start
  tags:
    - start
  block:
    - name: Clean up Docker
      when: system_cleanup_docker | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_docker.yml"
