---
- name: Ensure the Docker cleanup files do not exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ system_cleanup_bin_path }}/cleanup-docker"
    - "{{ system_cleanup_config_path }}/docker.json"
