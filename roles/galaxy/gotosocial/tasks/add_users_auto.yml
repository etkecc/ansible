---
- name: Ensure GoToSocial service is started with the current configuration
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/util/ensure_service_started.yml"

- name: Ensure GoToSocial users are created
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/util/ensure_user_registered.yml"
  with_items: "{{ gotosocial_users }}"
  loop_control:
    loop_var: user
  no_log: true
