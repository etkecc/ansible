---
- name: Verify GoToSocial backed by Postgres
  hosts: all
  become: true
  gather_facts: false

  vars:
    gotosocial_verify_units:
      - gotosocial.service
      - postgres.service

  tasks:
    - name: Verify that GoToSocial works
      block:
        - name: Run the shared GoToSocial verification
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        # The docker CLI is invoked directly, because the lint environment used in
        # CI has no collections beyond ansible-core available.
        - name: Count the GoToSocial tables in the Postgres database
          ansible.builtin.command:
            cmd: >-
              docker exec -e PGPASSWORD={{ gotosocial_database_password | quote }} {{ postgres_identifier | default('postgres') }}
              psql -U {{ gotosocial_database_username | quote }} -d {{ gotosocial_database_name | quote }}
              -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'"
          register: gotosocial_postgres_tables
          changed_when: false

        - name: Assert GoToSocial has migrated its schema into Postgres
          ansible.builtin.assert:
            that: gotosocial_postgres_tables.stdout | trim | int > 0
            fail_msg: "The Postgres database '{{ gotosocial_database_name }}' holds no GoToSocial tables - GoToSocial is not using it"
            success_msg: "The Postgres database '{{ gotosocial_database_name }}' holds {{ gotosocial_postgres_tables.stdout | trim }} GoToSocial tables"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "gotosocial_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: gotosocial_restarts_before
              loop: "{{ gotosocial_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: gotosocial_restarts_after
              loop: "{{ gotosocial_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - gotosocial_restarts_after.results | map(attribute='status.NRestarts') | list == gotosocial_restarts_before.results | map(attribute='status.NRestarts') | list
                  - gotosocial_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in gotosocial_verify_units | zip(gotosocial_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in gotosocial_verify_units | zip(gotosocial_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in gotosocial_verify_units | zip(gotosocial_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the GoToSocial verification summary
          ansible.builtin.debug:
            msg:
              - "GoToSocial systemd: {% for unit, state in gotosocial_verify_units | zip(gotosocial_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "GoToSocial restarts: {% for unit, restarts in gotosocial_verify_units | zip(gotosocial_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "GoToSocial postgres tables: {{ gotosocial_postgres_tables.stdout | trim }}"
              - "GoToSocial web frontend: HTTP {{ gotosocial_frontend.status }}"
              - "GoToSocial nodeinfo software: {{ gotosocial_nodeinfo.json.software.name }} {{ gotosocial_nodeinfo.json.software.version | default('(no version)') }}"
              - "GoToSocial instance API: {{ gotosocial_instance_api.json.uri }} ({{ gotosocial_instance_api.json.version }})"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the GoToSocial systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=gotosocial.service
          register: gotosocial_service_log
          changed_when: false

        - name: Show the GoToSocial systemd service log
          ansible.builtin.debug:
            var: gotosocial_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "GoToSocial verification failed. The systemd service log is printed above."
