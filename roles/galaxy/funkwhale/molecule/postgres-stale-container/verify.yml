---
# A container's configuration (environment variables, labels, etc.) is frozen at creation time.
#
# This scenario emulates a run which changed Funkwhale's configuration (here: the database password,
# which affects both the API and the frontend containers), but did not get to restart the services
# (e.g. because it failed midway).
#
# It then verifies that:
# - subsequent runs still consider a restart necessary, even though the configuration files no longer change
# - running in check mode works
# - creating users (which runs commands inside the API container) restarts the stale services first, instead of failing
# - the service manager does not restart the services once again afterwards
# - once restarted, the containers are no longer considered stale
#
# It also verifies the same for a change which only affects a service running inside the API container
# (here: the Celery worker's concurrency, which is part of its systemd unit).
#
# Finally, it runs the `default` scenario's verification against the restarted services.
- name: Verify Funkwhale recovers from stale containers
  hosts: all
  become: true
  gather_facts: true

  vars:
    funkwhale_verify_container_id_command: "docker inspect --type=container --format={{ '{{' }}.Id{{ '}}' }}"

    funkwhale_verify_containers:
      - funkwhale-api
      - funkwhale-frontend

    # All services that the service manager manages based on `funkwhale_restart_necessary`.
    funkwhale_verify_managed_units:
      - funkwhale-api.service
      - funkwhale-frontend.service
      - funkwhale-celery-worker.service
      - funkwhale-celery-beat.service

  tasks:
    # The shared verification writes to the database (and cannot be repeated against the same database),
    # so it only runs once, at the end. Readiness is enough to establish the starting point.
    - name: Wait for Funkwhale to serve its instance settings (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:{{ funkwhale_frontend_container_http_host_bind_port }}/api/v1/instance/settings/"
        method: GET
        status_code: [200, 500, 502, 503, 504]
      register: funkwhale_settings
      until: funkwhale_settings.status == 200
      retries: 120
      delay: 5

    - name: Retrieve the original Funkwhale container IDs
      ansible.builtin.command:
        cmd: "{{ funkwhale_verify_container_id_command }} {{ item }}"
      register: funkwhale_original_container_ids
      changed_when: false
      loop: "{{ funkwhale_verify_containers }}"

    - name: Change the Funkwhale database password
      ansible.builtin.set_fact:
        funkwhale_database_password: my_changed_database_password

    - name: Apply the changed configuration without restarting Funkwhale
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-postgres
        - ansible-role-valkey
      loop_control:
        loop_var: role_name

    - name: Install Funkwhale with the changed configuration
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: install
        public: true

    - name: Assert that a Funkwhale restart is considered necessary
      ansible.builtin.assert:
        that: funkwhale_restart_necessary | bool
        fail_msg: "A Funkwhale restart is not considered necessary, even though its configuration changed"

    - name: Install Funkwhale again, without any configuration changes
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: install
        public: true

    - name: Assert that a Funkwhale restart is still considered necessary
      ansible.builtin.assert:
        that:
          - funkwhale_restart_necessary | bool
          - funkwhale_container_stale | bool
        fail_msg: >-
          A Funkwhale restart is no longer considered necessary,
          even though the running containers were created from an older configuration

    - name: Install Funkwhale again, in check mode
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: install
        public: true
        apply:
          check_mode: true

    - name: Assert that a Funkwhale restart is still considered necessary in check mode
      ansible.builtin.assert:
        that:
          - funkwhale_restart_necessary | bool
          - funkwhale_container_stale | bool
        fail_msg: "A Funkwhale restart is not considered necessary in check mode, even though the running containers are stale"

    - name: Assert that the original Funkwhale containers are still running
      ansible.builtin.command:
        cmd: "{{ funkwhale_verify_container_id_command }} {{ item.item }}"
      register: funkwhale_container_ids
      changed_when: false
      failed_when: funkwhale_container_ids.stdout != item.stdout
      loop: "{{ funkwhale_original_container_ids.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Emulates a run which only creates users (e.g. one invoked with the users-creation tag only),
    # so the decision to restart has to come from the stale containers themselves.
    - name: Forget that a Funkwhale restart is considered necessary
      ansible.builtin.set_fact:
        funkwhale_restart_necessary: false

    - name: Create Funkwhale users
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: add_users_auto
        public: true
      vars:
        funkwhale_users_additional:
          # Not `admin`, which Funkwhale reserves.
          - username: staleadmin
            initial_email: staleadmin@example.com
            initial_password: my_admin_password
            initial_type: admin

    - name: Retrieve the Funkwhale container IDs after creating users
      ansible.builtin.command:
        cmd: "{{ funkwhale_verify_container_id_command }} {{ item }}"
      register: funkwhale_restarted_container_ids
      changed_when: false
      loop: "{{ funkwhale_verify_containers }}"

    - name: Assert that all Funkwhale containers were recreated and no further restart is considered necessary
      ansible.builtin.assert:
        that:
          - funkwhale_restarted_container_ids.results[0].stdout != funkwhale_original_container_ids.results[0].stdout
          - funkwhale_restarted_container_ids.results[1].stdout != funkwhale_original_container_ids.results[1].stdout
          - not funkwhale_restart_necessary | bool
        fail_msg: >-
          Not all Funkwhale containers were recreated before creating users,
          or a restart is still considered necessary ({{ funkwhale_restart_necessary }})

    # Emulates the service manager, which restarts services whose restart is considered necessary
    # and merely starts the others.
    - name: Ensure Funkwhale services are restarted or started, as the service manager would do
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: "{{ 'restarted' if funkwhale_restart_necessary | bool else 'started' }}"
        daemon_reload: true
      loop: "{{ funkwhale_verify_managed_units }}"

    - name: Retrieve the Funkwhale container IDs after the service manager
      ansible.builtin.command:
        cmd: "{{ funkwhale_verify_container_id_command }} {{ item }}"
      register: funkwhale_container_ids_after_manager
      changed_when: false
      loop: "{{ funkwhale_verify_containers }}"

    - name: Assert that the service manager did not restart Funkwhale once again
      ansible.builtin.assert:
        that: >-
          funkwhale_container_ids_after_manager.results | map(attribute='stdout') | list
          == funkwhale_restarted_container_ids.results | map(attribute='stdout') | list
        fail_msg: "The Funkwhale containers were restarted twice"

    - name: Install Funkwhale again, after the restart
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: install
        public: true

    - name: Assert that a Funkwhale restart is no longer considered necessary
      ansible.builtin.assert:
        that:
          - not funkwhale_container_stale | bool
          - not funkwhale_restart_necessary | bool
        fail_msg: "A Funkwhale restart is considered necessary, even though the running containers are up to date"

    - name: Ensure the Funkwhale user created while the containers were stale exists
      ansible.builtin.command:
        cmd: >-
          docker exec funkwhale-api bash -c 'funkwhale-manage fw users create
          --username staleadmin --email staleadmin@example.com --password my_admin_password --superuser'
      register: funkwhale_admin_create_result
      changed_when: false
      failed_when: "'username already exists' not in funkwhale_admin_create_result.stdout"

    # A change which only affects a service running inside the API container (via `docker exec`).
    - name: Change the Funkwhale Celery worker concurrency
      ansible.builtin.set_fact:
        funkwhale_celery_worker_concurrency: 3

    - name: Install Funkwhale with the changed Celery worker concurrency
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: install
        public: true

    - name: Install Funkwhale again, without any configuration changes
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: install
        public: true

    - name: Assert that a Funkwhale restart is considered necessary because of the Celery worker change
      ansible.builtin.assert:
        that:
          - funkwhale_restart_necessary | bool
          - funkwhale_container_stale | bool
        fail_msg: >-
          A Funkwhale restart is not considered necessary,
          even though the Celery worker was started from an older systemd unit

    - name: Ensure Funkwhale services are restarted or started, as the service manager would do
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: "{{ 'restarted' if funkwhale_restart_necessary | bool else 'started' }}"
        daemon_reload: true
      loop: "{{ funkwhale_verify_managed_units }}"

    # The Celery worker runs `docker exec` into the API container, so its process shows up there.
    # It may take a few attempts to start (it is restarted every 30s until the API container is up).
    - name: Wait for the Funkwhale Celery worker to run with the changed concurrency (up to 3m)
      ansible.builtin.command:
        cmd: docker top funkwhale-api -eo pid,args
      register: funkwhale_api_processes
      changed_when: false
      until: funkwhale_api_processes.stdout_lines | select('search', 'worker .*--concurrency=3') | list | length > 0
      retries: 36
      delay: 5

    - name: Install Funkwhale again, after the restart
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: install
        public: true

    - name: Assert that a Funkwhale restart is no longer considered necessary
      ansible.builtin.assert:
        that:
          - not funkwhale_container_stale | bool
          - not funkwhale_restart_necessary | bool
        fail_msg: "A Funkwhale restart is considered necessary, even though the running containers are up to date"

# Proves that the restarted containers use the changed database password.
# The changed configuration (set via `set_fact` above) carries over to this verification.
- name: Run the default Funkwhale verification after the restart
  ansible.builtin.import_playbook: ../default/verify.yml
