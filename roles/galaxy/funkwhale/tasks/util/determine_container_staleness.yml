---
# Determines whether the currently running Funkwhale containers are stale,
# i.e. they were created from an older version of their configuration (env file, labels, systemd units) or from an older image.
#
# A container's configuration is frozen at creation time, so changes to these files only take effect after a restart.
# If a previous run changed them but did not manage to restart the services (e.g. because it failed midway),
# subsequent runs would not see any changes and would never restart the services on their own.
#
# Funkwhale runs 2 containers (API and frontend).
# The Celery worker, Celery beat and (optional) watch-imports services do not have containers of their own,
# but run processes inside the API container (via `docker exec`) and get restarted along with the API service.
# Their systemd units are therefore checked against the API container's creation time.
#
# Sets `funkwhale_container_stale` (bool): whether any of the Funkwhale containers is stale.

- name: Determine whether the Funkwhale API container is stale
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/util/determine_container_staleness_container.yml"
  vars:
    funkwhale_container_staleness_identifier: "{{ funkwhale_api_identifier }}"
    funkwhale_container_staleness_image: "{{ funkwhale_api_container_image }}"
    funkwhale_container_staleness_files: |
      {{
        [
          funkwhale_api_base_path ~ '/env',
          funkwhale_api_base_path ~ '/labels',
          devture_systemd_docker_base_systemd_path ~ '/' ~ funkwhale_api_identifier ~ '.service',
          devture_systemd_docker_base_systemd_path ~ '/' ~ funkwhale_celery_worker_identifier ~ '.service',
          devture_systemd_docker_base_systemd_path ~ '/' ~ funkwhale_celery_beat_identifier ~ '.service',
        ]
        +
        ([devture_systemd_docker_base_systemd_path ~ '/' ~ funkwhale_watch_imports_identifier ~ '.service'] if funkwhale_watch_imports_enabled | bool else [])
      }}

- name: Remember whether the Funkwhale API container is stale
  ansible.builtin.set_fact:
    funkwhale_container_stale: "{{ funkwhale_container_staleness_container_stale | bool }}"

- name: Determine whether the Funkwhale frontend container is stale
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/util/determine_container_staleness_container.yml"
  vars:
    funkwhale_container_staleness_identifier: "{{ funkwhale_frontend_identifier }}"
    funkwhale_container_staleness_image: "{{ funkwhale_frontend_container_image }}"
    funkwhale_container_staleness_files:
      - "{{ funkwhale_frontend_base_path }}/env"
      - "{{ funkwhale_frontend_base_path }}/labels"
      - "{{ devture_systemd_docker_base_systemd_path }}/{{ funkwhale_frontend_identifier }}.service"

- name: Determine whether any Funkwhale container is stale
  ansible.builtin.set_fact:
    funkwhale_container_stale: "{{ funkwhale_container_stale | bool or funkwhale_container_staleness_container_stale | bool }}"
