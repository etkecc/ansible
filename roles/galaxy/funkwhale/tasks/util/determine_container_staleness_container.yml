---
# Determines whether a single running Funkwhale container is stale,
# i.e. it was created from an older version of its configuration (env file, labels, systemd unit) or from an older image.
#
# Expects:
# - `funkwhale_container_staleness_identifier`: the container (and systemd service) name
# - `funkwhale_container_staleness_image`: the image the container is supposed to run
# - `funkwhale_container_staleness_files`: files whose contents are frozen into the container at creation time
#
# Sets `funkwhale_container_staleness_container_stale` (bool).
#
# Used by `determine_container_staleness.yml`, once per container.

- name: Inspect the Funkwhale container ({{ funkwhale_container_staleness_identifier }})
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} inspect --type=container {{ funkwhale_container_staleness_identifier }}"
  register: funkwhale_container_staleness_container_inspect_result
  changed_when: false
  failed_when: false
  check_mode: false
  # The output contains the container's environment variables, which include secrets.
  no_log: true

- name: Determine Funkwhale container facts ({{ funkwhale_container_staleness_identifier }})
  vars:
    container: "{{ (funkwhale_container_staleness_container_inspect_result.stdout | from_json | first) if funkwhale_container_staleness_container_inspect_result.rc == 0 else {} }}"
    # `Created` looks like `2026-01-02T03:04:05.123456789Z` (always UTC, trailing zeros in the fractional part may be omitted).
    container_created: "{{ container.Created | default('1970-01-01T00:00:00Z') }}"
    container_created_fraction: "{{ container_created | regex_search('\\.([0-9]+)', '\\1') | default([], true) | first | default('0') }}"
  ansible.builtin.set_fact:
    funkwhale_container_staleness_container_running: "{{ container.State.Running | default(false) | bool }}"
    funkwhale_container_staleness_container_created_timestamp: >-
      {{
        ((container_created[:19] ~ '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S%z')).timestamp() | int
        + ('0.' ~ container_created_fraction[:6]) | float
      }}
    funkwhale_container_staleness_container_image_id: "{{ container.Image | default('') }}"

- name: Inspect the Funkwhale container image and files, if the container is running ({{ funkwhale_container_staleness_identifier }})
  when: funkwhale_container_staleness_container_running | bool
  block:
    - name: Inspect the Funkwhale container image ({{ funkwhale_container_staleness_identifier }})
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} image inspect --format={{ '{{' }}.Id{{ '}}' }} {{ funkwhale_container_staleness_image }}"
      register: funkwhale_container_staleness_image_inspect_result
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check Funkwhale files that affect the container ({{ funkwhale_container_staleness_identifier }})
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      register: funkwhale_container_staleness_file_stat_results
      loop: "{{ funkwhale_container_staleness_files }}"

- name: Determine whether the Funkwhale container is stale ({{ funkwhale_container_staleness_identifier }})
  ansible.builtin.set_fact:
    funkwhale_container_staleness_container_stale: >-
      {{
        funkwhale_container_staleness_container_running | bool
        and (
          (
            funkwhale_container_staleness_image_inspect_result.rc == 0
            and funkwhale_container_staleness_image_inspect_result.stdout | trim != funkwhale_container_staleness_container_image_id
          )
          or
          (
            funkwhale_container_staleness_file_stat_results.results
            | selectattr('stat.exists')
            | map(attribute='stat.mtime')
            | map('float')
            | select('gt', funkwhale_container_staleness_container_created_timestamp | float)
            | list
            | length > 0
          )
        )
      }}
