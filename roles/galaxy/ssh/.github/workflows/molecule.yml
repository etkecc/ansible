---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        distro:
          - ubuntu2604
          - debian13
        scenario:
          - default
          - socket-activated
        # The socket-activated scenario is written for the arrangement Ubuntu
        # ships by default, and asserts that the role's `Port` setting is inert
        # on such a host. On Debian, enabling ssh.socket by hand produces a host
        # whose sshd cannot survive the role's reload at all (see
        # molecule/README.md), so there is nothing green to assert there.
        exclude:
          - distro: debian13
            scenario: socket-activated
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: ssh

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ssh/.python-version
          cache: pip
          cache-dependency-path: ssh/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: ssh
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ssh/molecule/*/requirements.yml') }}

      - name: Run Molecule
        working-directory: ssh
        run: molecule test --scenario-name ${{ matrix.scenario }}
