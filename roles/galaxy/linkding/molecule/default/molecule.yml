---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: linkding-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        linkding_debug_service_enabled: false

        # Variables for linkding
        linkding_uid: 1000
        linkding_gid: 1000
        linkding_scheme: http
        linkding_hostname: localhost
        linkding_container_labels_traefik_enabled: false
        linkding_container_http_host_bind_port: 9090
        linkding_database_type: sqlite

        # An initial superuser, so that the verifier has an account to log in
        # with and to bind an API token to. Without one, linkding exposes no
        # authenticated surface at all and there is nothing to test beyond the
        # login page - which renders even when the database is unreachable.
        linkding_superuser_username: molecule
        linkding_superuser_password: molecule-password-1234
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
