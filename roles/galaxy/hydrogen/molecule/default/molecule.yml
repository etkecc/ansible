---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: hydrogen-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        hydrogen_debug_service_enabled: false

        # The port on the host that Hydrogen is published on. In a real
        # deployment, Hydrogen sits behind a reverse-proxy and is not published
        # at all, so the scenario picks a port itself.
        hydrogen_molecule_http_bind_port: 8080

        # Status codes that the verification requests accept without failing
        # the request task itself. `uri` fails on anything outside this list
        # before an assertion gets to look at the response, which would report
        # a bare status-code error instead of naming the check that went wrong.
        hydrogen_molecule_http_status_codes: [200, 301, 302, 304, 400, 401, 403, 404, 405, 500, 502, 503]

        # Variables for Hydrogen
        hydrogen_uid: 1000
        hydrogen_gid: 1000
        hydrogen_scheme: http
        hydrogen_hostname: localhost
        hydrogen_container_labels_traefik_enabled: false
        hydrogen_container_http_host_bind_port: "127.0.0.1:{{ hydrogen_molecule_http_bind_port }}"

        # A bare Hydrogen image ships a `config.json` of its own and serves it
        # from the very same path, so a request for it succeeds whether or not
        # this role did anything. The image's copy names `matrix.org` as the
        # default homeserver, so a hostname that appears nowhere in it is what
        # lets the assertions in `verify.yml` tell the two files apart.
        hydrogen_default_hs_url: https://matrix.molecule.example.com

        # The extension is combined into the rendered configuration recursively,
        # which is how a deployment sets keys the role has no variable for.
        # Replacing `push.gatewayUrl` while leaving the sibling keys of `push`
        # alone leaves a mark that neither the image's own `config.json` (which
        # names `https://matrix.org` there too) nor the role's defaults can
        # produce, and shows that the merge reaches into nested objects rather
        # than replacing them wholesale.
        hydrogen_configuration_extension_json: |
          {
            "push": {
              "gatewayUrl": "https://push.molecule.example.com"
            },
            "bugReportEndpointUrl": "https://bugs.molecule.example.com/submit"
          }
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
