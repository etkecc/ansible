---
- name: Verify Grafana features scenario
  hosts: all
  become: true
  gather_facts: false

  vars:
    grafana_url: "http://localhost:3000"

    grafana_verify_units:
      - grafana.service

  tasks:
    - name: Verify that Grafana works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: grafana_defaults

        - name: Wait for the Grafana systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: grafana_services
          until: grafana_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ grafana_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Grafana systemd services are active
          ansible.builtin.assert:
            that: grafana_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(grafana_verify_units | zip(grafana_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Grafana systemd services log for debugging
          when: grafana_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ grafana_verify_units }}"

        - name: Wait for Grafana to report itself healthy (up to 180s)
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/health"
            method: GET
            status_code: 200
          register: grafana_health
          until: grafana_health.status == 200
          retries: 36
          delay: 5
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        - name: Assert Grafana reports itself healthy
          ansible.builtin.assert:
            that: grafana_health.status == 200
            fail_msg: "Grafana did not report itself healthy: {{ grafana_health.status | default('no response') }}"
            success_msg: "Grafana reports itself healthy"

        - name: Assert Grafana API reports a healthy database
          ansible.builtin.assert:
            that: grafana_health.json.database == 'ok'
            fail_msg: "Grafana did not report its database to be healthy: {{ grafana_health.json.database | default('no response') }}"
            success_msg: "Grafana reports its database to be healthy"

        # Compared as a prefix, so that a version reported with a build suffix
        # keeps matching. Grafana sends no version response header, so this payload
        # is the honest surface for it.
        - name: Assert the running Grafana is the version this role installs
          ansible.builtin.assert:
            that: grafana_health.json.version.startswith(grafana_defaults.grafana_version)
            fail_msg: "Grafana reports {{ grafana_health.json.version | default('none') }}, expected {{ grafana_defaults.grafana_version }}"
            success_msg: "Grafana reports {{ grafana_health.json.version }}"

        # Reports the configuration the Grafana process actually parsed. The
        # settings asserted below are all ones this scenario overrides away from
        # both the role defaults and the image defaults, so observing them here
        # proves the templated grafana.ini reached the process rather than merely
        # having been written to disk.
        - name: Query the settings the Grafana process is running with
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/admin/settings"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            follow_redirects: none
            status_code: 200
          register: grafana_settings

        - name: Assert Grafana runs with the configuration this scenario generated
          ansible.builtin.assert:
            that:
              - grafana_settings.json.security.admin_user == grafana_default_admin_user
              - grafana_settings.json.server.root_url == 'https://' ~ grafana_hostname ~ grafana_defaults.grafana_path_prefix
              - grafana_settings.json.security.allow_embedding | bool
              - grafana_settings.json.metrics.enabled | bool
            fail_msg: >-
              Grafana is not running with the configuration this scenario generated:
              admin_user={{ grafana_settings.json.security.admin_user }},
              root_url={{ grafana_settings.json.server.root_url }},
              allow_embedding={{ grafana_settings.json.security.allow_embedding }},
              metrics.enabled={{ grafana_settings.json.metrics.enabled }}
            success_msg: "Grafana runs with the configuration this scenario generated"

        - name: Query provisioned datasources via the Grafana API
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/datasources"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            status_code: 200
          register: grafana_datasources

        - name: Assert the TestData datasource is provisioned
          ansible.builtin.assert:
            that: "'TestData' in (grafana_datasources.json | map(attribute='name') | list)"
            fail_msg: "TestData datasource not found ({{ grafana_datasources.json | map(attribute='name') | list }})"
            success_msg: "TestData datasource is provisioned"

        - name: Fetch the /metrics endpoint
          ansible.builtin.uri:
            url: "{{ grafana_url }}/metrics"
            method: GET
            return_content: true
            status_code: 200
          register: grafana_metrics

        - name: Assert /metrics returns Prometheus content
          ansible.builtin.assert:
            that:
              - grafana_metrics.status == 200
              - "'grafana_build_info' in grafana_metrics.content"
            fail_msg: "/metrics did not return expected Prometheus content"
            success_msg: "Metrics endpoint is enabled"

        - name: Assert wrong password is rejected with 401
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/org"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: wrongpassword
            force_basic_auth: true
            status_code: 401
          register: grafana_bad_auth

        - name: Assert wrong password returns 401
          ansible.builtin.assert:
            that: grafana_bad_auth.status == 401
            fail_msg: "Wrong password should return 401, got {{ grafana_bad_auth.status }}"
            success_msg: "Custom admin credentials are enforced"

        - name: Assert Content-Security-Policy header is present
          ansible.builtin.assert:
            that: "'content_security_policy' in grafana_bad_auth"
            fail_msg: "Content-Security-Policy header not found"
            success_msg: "Content-Security-Policy header is present"

        - name: Assert X-Frame-Options is absent (allow_embedding is enabled)
          ansible.builtin.assert:
            that: "'x_frame_options' not in grafana_bad_auth"
            fail_msg: "X-Frame-Options is present — embedding appears blocked"
            success_msg: "X-Frame-Options is absent (embedding allowed)"

        - name: Assert custom admin credentials authenticate
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/org"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            status_code: 200
          register: grafana_good_auth

        - name: Assert correct credentials return 200
          ansible.builtin.assert:
            that: grafana_good_auth.status == 200
            fail_msg: "Custom admin credentials failed ({{ grafana_good_auth.status }})"
            success_msg: "Custom admin credentials work correctly"

        - name: Search for provisioned dashboard template file
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/search?query=Molecule+Test+Dashboard&type=dash-db"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            status_code: 200
          register: grafana_dashboard_search

        - name: Assert Molecule Test Dashboard is provisioned
          ansible.builtin.assert:
            that: >-
              'Molecule Test Dashboard' in
              (grafana_dashboard_search.json | map(attribute='title') | list)
            fail_msg: "Molecule Test Dashboard not found: {{ grafana_dashboard_search.json | map(attribute='title') | list }}"
            success_msg: "Molecule Test Dashboard is provisioned"

        - name: Query provisioned alert rules
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/v1/provisioning/alert-rules"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            status_code: 200
          register: grafana_alert_rules

        - name: Assert test alert rule is provisioned
          ansible.builtin.assert:
            that: >-
              'TestData Always-Normal Rule' in
              (grafana_alert_rules.json | map(attribute='title') | list)
            fail_msg: "Alert rule not found: {{ grafana_alert_rules.json | map(attribute='title') | list }}"
            success_msg: "Alert rule is provisioned"

        - name: Query provisioned contact points
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/v1/provisioning/contact-points"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            status_code: 200
          register: grafana_contact_points

        - name: Assert test-contact-point is provisioned
          ansible.builtin.assert:
            that: >-
              'test-contact-point' in
              (grafana_contact_points.json | map(attribute='name') | list)
            fail_msg: "Contact point not found: {{ grafana_contact_points.json | map(attribute='name') | list }}"
            success_msg: "Contact point is provisioned"

        - name: Query provisioned notification policies
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/v1/provisioning/policies"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            status_code: 200
          register: grafana_policies

        - name: Assert root policy receiver is test-contact-point
          ansible.builtin.assert:
            that: grafana_policies.json.receiver == 'test-contact-point'
            fail_msg: "Root policy receiver: {{ grafana_policies.json.receiver | default('') }}"
            success_msg: "Notification policy is provisioned"

        - name: Query provisioned mute timings
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/v1/provisioning/mute-timings"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            status_code: 200
          register: grafana_mute_timings

        - name: Assert test-mute-timing is provisioned
          ansible.builtin.assert:
            that: >-
              'test-mute-timing' in
              (grafana_mute_timings.json | map(attribute='name') | list)
            fail_msg: "Mute timing not found: {{ grafana_mute_timings.json | map(attribute='name') | list }}"
            success_msg: "Mute timing is provisioned"

        - name: Query provisioned notification templates
          ansible.builtin.uri:
            url: "{{ grafana_url }}/api/v1/provisioning/templates"
            method: GET
            url_username: "{{ grafana_default_admin_user }}"
            url_password: "{{ grafana_default_admin_password }}"
            force_basic_auth: true
            status_code: 200
          register: grafana_notif_templates

        - name: Assert test-notification-template is provisioned
          ansible.builtin.assert:
            that: >-
              'test-notification-template' in
              (grafana_notif_templates.json | map(attribute='name') | list)
            fail_msg: "Notification template not found: {{ grafana_notif_templates.json | map(attribute='name') | list }}"
            success_msg: "Notification template is provisioned"

        - name: Assert test-extra-template is provisioned via alerting template file
          ansible.builtin.assert:
            that: >-
              'test-extra-template' in
              (grafana_notif_templates.json | map(attribute='name') | list)
            fail_msg: "Extra template not found: {{ grafana_notif_templates.json | map(attribute='name') | list }}"
            success_msg: "Alerting template file is provisioned"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "grafana_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: grafana_restarts_before
              loop: "{{ grafana_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: grafana_restarts_after
              loop: "{{ grafana_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - grafana_restarts_after.results | map(attribute='status.NRestarts') | list == grafana_restarts_before.results | map(attribute='status.NRestarts') | list
                  - grafana_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in grafana_verify_units | zip(grafana_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in grafana_verify_units | zip(grafana_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in grafana_verify_units | zip(grafana_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Grafana features verification summary
          ansible.builtin.debug:
            msg:
              - "Grafana systemd: {% for unit, state in grafana_verify_units | zip(grafana_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Grafana restarts: {% for unit, restarts in grafana_verify_units | zip(grafana_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Grafana version: {{ grafana_health.json.version }}"
              - "Grafana HTTP: {{ grafana_health.status }}"
              - "Grafana database: {{ grafana_health.json.database }}"
              - "Grafana root_url: {{ grafana_settings.json.server.root_url }}"
              - "Grafana admin_user: {{ grafana_settings.json.security.admin_user }}"
              - "Grafana datasources: {{ grafana_datasources.json | map(attribute='name') | list }}"
              - "Grafana metrics HTTP: {{ grafana_metrics.status }}"
              - "Grafana alert rules: {{ grafana_alert_rules.json | map(attribute='title') | list }}"
              - "Grafana contact points: {{ grafana_contact_points.json | map(attribute='name') | list }}"
              - "Grafana mute timings: {{ grafana_mute_timings.json | map(attribute='name') | list }}"
              - "Grafana notification templates: {{ grafana_notif_templates.json | map(attribute='name') | list }}"
              - "Grafana dashboards: {{ grafana_dashboard_search.json | map(attribute='title') | list }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Grafana systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=grafana.service
          register: grafana_service_log
          changed_when: false

        - name: Show the Grafana systemd service log
          ansible.builtin.debug:
            var: grafana_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Grafana verification failed. The systemd service log is printed above."
