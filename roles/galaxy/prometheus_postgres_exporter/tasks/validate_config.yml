---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "prometheus_postgres_exporter_port", "new": "prometheus_postgres_exporter_container_http_port" }
    - { "old": "prometheus_postgres_exporter_server_fqn", "new": "prometheus_postgres_exporter_hostname" }
    - { "old": "prometheus_postgres_exporter_basicauth_enabled", "new": "prometheus_postgres_exporter_container_labels_traefik_metrics_middleware_basic_auth_enabled" }
    - { "old": "prometheus_postgres_exporter_basicauth_user", "new": "prometheus_postgres_exporter_container_labels_traefik_metrics_middleware_basic_auth_users" }
    - { "old": "prometheus_postgres_exporter_basicauth_password", "new": "prometheus_postgres_exporter_container_labels_traefik_metrics_middleware_basic_auth_users" }
    - { "old": "prometheus_postgres_exporter_basicauth_print", "new": "<removed>" }
    - { "old": "prometheus_postgres_exporter_basicauth_file_contents", "new": "<removed>" }
    - { "old": "prometheus_postgres_exporter_docker_image_name_prefix", "new": "prometheus_postgres_exporter_container_image_registry_prefix" }
    - { "old": "prometheus_postgres_exporter_docker_image", "new": "prometheus_postgres_exporter_container_image" }
    - { "old": "prometheus_postgres_exporter_docker_image_registry_prefix", "new": "prometheus_postgres_exporter_container_image_registry_prefix" }
    - "old": "prometheus_postgres_exporter_docker_image_registry_prefix_upstream"
      "new": "prometheus_postgres_exporter_container_image_registry_prefix_upstream"
    - "old": "prometheus_postgres_exporter_docker_image_registry_prefix_upstream_default"
      "new": "prometheus_postgres_exporter_container_image_registry_prefix_upstream_default"
    - { "old": "prometheus_postgres_exporter_docker_image_force_pull", "new": "prometheus_postgres_exporter_container_image_force_pull" }
    - "old": "prometheus_postgres_exporter_environment_variables_extension"
      "new": "prometheus_postgres_exporter_environment_variables_additional_variables"
    - { "old": "prometheus_postgres_exporter_database_ssl", "new": "prometheus_postgres_exporter_database_sslmode" }
    - { "old": "prometheus_postgres_exporter_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }
    - "old": "prometheus_postgres_exporter_env_variable_pg_exporter_auto_discover_databases"
      "new": "prometheus_postgres_exporter_auto_discover_databases_enabled"
    - "old": "prometheus_postgres_exporter_env_variable_pg_exporter_web_listen_address"
      "new": "prometheus_postgres_exporter_web_listen_address"

# postgres_exporter v0.21.0 deprecated these environment variables in favor of command-line flags and
# will stop reading them in v0.22.0. `PG_EXPORTER_WEB_LISTEN_ADDRESS` is no longer read at all.
- name: (Deprecation) Catch and report exporter environment variables replaced by command-line flags
  ansible.builtin.fail:
    msg: |-
      `prometheus_postgres_exporter_environment_variables_additional_variables` sets environment variables
      which the exporter no longer reads, or will stop reading: {{ prometheus_postgres_exporter_deprecated_environment_variables | join(', ') }}.
      Pass the corresponding command-line flags via `prometheus_postgres_exporter_process_extra_arguments_custom` instead
      (e.g. `PG_EXPORTER_WEB_TELEMETRY_PATH=/metrics` -> `--web.telemetry-path=/metrics`).
      See https://github.com/prometheus-community/postgres_exporter/releases/tag/v0.21.0 for the flag of each variable.
  vars:
    prometheus_postgres_exporter_deprecated_environment_variables: >-
      {{
        prometheus_postgres_exporter_environment_variables_additional_variables
        | regex_findall('^\s*(PG_EXPORTER_[A-Z_]+|DATA_SOURCE_URI|DATA_SOURCE_URI_FILE|DATA_SOURCE_USER_FILE|DATA_SOURCE_PASS_FILE)=', multiline=True)
        | unique
      }}
  when: prometheus_postgres_exporter_deprecated_environment_variables | length > 0

- name: (Deprecation) Catch and report renamed variables for Traefik labels
  ansible.builtin.fail:
    msg: |-
      Your configuration contains a variable, which now has a different name.
      Please rename all `prometheus_postgres_exporter_container_labels_metrics_*` variables to `prometheus_postgres_exporter_container_labels_traefik_metrics_*` on your configuration file (vars.yml).

      The following variables in your configuration need to be renamed: {{ lookup('ansible.builtin.varnames', '^prometheus_postgres_exporter_container_labels_metrics_.+', wantlist=True) | join(', ') }}
  when: "lookup('ansible.builtin.varnames', '^prometheus_postgres_exporter_container_labels_metrics_.+', wantlist=True) | length > 0"

- name: Fail if required Prometheus Postgres exporter settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - prometheus_postgres_exporter_uid
    - prometheus_postgres_exporter_gid
    - prometheus_postgres_exporter_path_prefix
    - prometheus_postgres_exporter_container_network
    - prometheus_postgres_exporter_database_hostname
    - prometheus_postgres_exporter_database_password
