---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: container-socket-proxy-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        container_socket_proxy_debug_service_enabled: false
        container_socket_proxy_restarts_check_enabled: true

        # The port on the test host that the proxy is probed on in verify.yml.
        # The role does not publish a port of its own (consumers reach the
        # proxy over the container network at tcp://container-socket-proxy:2375),
        # so the scenario publishes one via the extra arguments below.
        container_socket_proxy_molecule_bind_port: 2375

        # Variables for Container Socket Proxy
        container_socket_proxy_uid: 1000
        container_socket_proxy_gid: 1000

        # Off in the role's defaults, and denied by the image's own built-in
        # defaults too. Turning it on here is what makes the allow probe in
        # verify.yml a test of this role rather than of the image: a
        # `/containers/json` that answers can only mean that the role rendered
        # `CONTAINERS=1` into its env file and that the container was started
        # with it.
        container_socket_proxy_api_containers_enabled: true

        container_socket_proxy_container_extra_arguments_custom:
          - "-p 127.0.0.1:{{ container_socket_proxy_molecule_bind_port }}:2375"
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
