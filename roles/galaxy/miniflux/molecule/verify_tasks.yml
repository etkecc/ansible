---
- name: Wait for the Miniflux systemd services to become active (up to 180s each)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  register: miniflux_services
  until: miniflux_services.status.ActiveState == 'active'
  retries: 36
  delay: 5
  loop: "{{ miniflux_verify_units }}"
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

# `Restart=always` in the systemd unit means that even a container which crashes
# and gets restarted reads as active here, so this is a precondition rather than
# a result.
- name: Assert the Miniflux systemd services are active
  ansible.builtin.assert:
    that: miniflux_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
    fail_msg: >-
      Not every service is active:
      {{ dict(miniflux_verify_units | zip(miniflux_services.results | map(attribute='status.ActiveState'))) }}
    success_msg: "Every systemd service is active"

- name: Retrieve the Miniflux systemd services log for debugging
  when: miniflux_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
  changed_when: false
  loop: "{{ miniflux_verify_units }}"

# /healthcheck is Miniflux's readiness probe: it answers 200/OK only after
# it has successfully pinged its database, so a passing probe proves that
# the Postgres wiring of this scenario (Unix socket, credentials, managed
# database) actually works, not merely that the process started.
- name: Wait for Miniflux to report itself healthy (up to 180s)
  ansible.builtin.uri:
    url: "{{ miniflux_verify_base_url }}/healthcheck"
    method: GET
    status_code: [200]
    return_content: true
  register: miniflux_health
  until: miniflux_health.status == 200 and miniflux_health.content is search('OK')
  retries: 36
  delay: 5
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

- name: Assert Miniflux reports itself healthy
  ansible.builtin.assert:
    that: miniflux_health.content is search('OK')
    fail_msg: "Miniflux did not report itself healthy: {{ miniflux_health.content | default('no response') }}"
    success_msg: "Miniflux reports itself healthy"

# An actual page render, which exercises template rendering and the static
# asset pipeline rather than just the HTTP listener. Unauthenticated
# requests to the root path are answered with the login page.
- name: Fetch the Miniflux login page
  ansible.builtin.uri:
    url: "{{ miniflux_verify_base_url }}/"
    method: GET
    status_code: [200]
    return_content: true
  register: miniflux_login_page

- name: Assert the login page renders a login form
  ansible.builtin.assert:
    that:
      - miniflux_login_page.content is search('Miniflux')
      - miniflux_login_page.content is search('name="password"')
    fail_msg: "The login page did not render a login form"
    success_msg: "The login page renders a login form"

# The REST API only answers once the database migrations have run and the
# admin account has been created from the environment file, so this reads
# back state that the role put into Postgres.
- name: Query the authenticated Miniflux API for the current user
  ansible.builtin.uri:
    url: "{{ miniflux_verify_base_url }}/v1/me"
    method: GET
    url_username: "{{ miniflux_admin_login }}"
    url_password: "{{ miniflux_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  register: miniflux_api_me

- name: Assert the admin account was created and is an administrator
  ansible.builtin.assert:
    that:
      - miniflux_api_me.json.username == miniflux_admin_login
      - miniflux_api_me.json.is_admin | bool
    fail_msg: "Unexpected /v1/me payload: {{ miniflux_api_me.json | default('no payload') }}"
    success_msg: "The admin account '{{ miniflux_admin_login }}' exists"

# A write against the database, read back through a separate request, which
# covers the whole path (API -> storage -> Postgres) in both directions.
- name: Create a category through the Miniflux API
  ansible.builtin.uri:
    url: "{{ miniflux_verify_base_url }}/v1/categories"
    method: POST
    url_username: "{{ miniflux_admin_login }}"
    url_password: "{{ miniflux_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      title: Molecule
    status_code: [201]
    return_content: true
  register: miniflux_api_category_created
  changed_when: true

- name: List the categories through the Miniflux API
  ansible.builtin.uri:
    url: "{{ miniflux_verify_base_url }}/v1/categories"
    method: GET
    url_username: "{{ miniflux_admin_login }}"
    url_password: "{{ miniflux_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  register: miniflux_api_categories

- name: Assert the created category was persisted
  ansible.builtin.assert:
    that: "'Molecule' in (miniflux_api_categories.json | map(attribute='title') | list)"
    fail_msg: "The created category was not persisted: {{ miniflux_api_categories.json | default('no payload') }}"
    success_msg: "A category was written to and read back from the database"

- name: Query the version of the running Miniflux
  ansible.builtin.uri:
    url: "{{ miniflux_verify_base_url }}/v1/version"
    method: GET
    url_username: "{{ miniflux_admin_login }}"
    url_password: "{{ miniflux_admin_password }}"
    force_basic_auth: true
    status_code: [200]
    return_content: true
  register: miniflux_version_reported
