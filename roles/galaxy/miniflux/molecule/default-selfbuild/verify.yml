---
- name: Verify Miniflux systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for Miniflux service to become active (up to 180s)
      ansible.builtin.systemd:
        name: miniflux.service
      register: miniflux_service
      until: miniflux_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Miniflux service is active
      ansible.builtin.assert:
        that: miniflux_service.status.ActiveState == 'active'
        fail_msg: "miniflux.service not active ({{ miniflux_service.status.ActiveState }})"
        success_msg: "miniflux.service is active"

    - name: Retrieve Miniflux service log for debugging
      when: miniflux_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu miniflux.service
      changed_when: false

    - name: Wait for Miniflux HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:8080/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: miniflux_endpoint
      until: miniflux_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert Miniflux HTTP endpoint responds
      ansible.builtin.assert:
        that: miniflux_endpoint.status in [200, 302]
        fail_msg: "Miniflux did not respond as expected ({{ miniflux_endpoint.status | default('no response') }})"
        success_msg: "Miniflux responded with {{ miniflux_endpoint.status }}"

    - name: Show Miniflux systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Miniflux systemd: {{ miniflux_service.status.ActiveState }}"
          - "Miniflux HTTP: {{ miniflux_endpoint.status }}"
