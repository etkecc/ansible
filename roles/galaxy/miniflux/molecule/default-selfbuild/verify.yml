---
- name: Verify self-built Miniflux
  hosts: all
  become: true
  gather_facts: false

  vars:
    miniflux_verify_base_url: "http://localhost:8080"

    miniflux_verify_units:
      - miniflux.service
      - postgres.service

  tasks:
    - name: Verify that Miniflux works
      block:
        - name: Run the checks shared by all Miniflux scenarios
          ansible.builtin.include_tasks:
            file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        - name: Assert the self-built Miniflux reports a version
          ansible.builtin.assert:
            that: miniflux_version_reported.json.version | default('') | length > 0
            fail_msg: "The self-built Miniflux did not report a version"
            success_msg: "The self-built Miniflux reports {{ miniflux_version_reported.json.version }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "miniflux_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: miniflux_restarts_before
              loop: "{{ miniflux_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: miniflux_restarts_after
              loop: "{{ miniflux_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - miniflux_restarts_after.results | map(attribute='status.NRestarts') | list == miniflux_restarts_before.results | map(attribute='status.NRestarts') | list
                  - miniflux_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in miniflux_verify_units | zip(miniflux_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in miniflux_verify_units | zip(miniflux_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in miniflux_verify_units | zip(miniflux_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Miniflux verification summary
          ansible.builtin.debug:
            msg:
              - "Miniflux systemd: {% for unit, state in miniflux_verify_units | zip(miniflux_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Miniflux restarts: {% for unit, restarts in miniflux_verify_units | zip(miniflux_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Miniflux version: {{ miniflux_version_reported.json.version }}"
              - "Miniflux health: {{ miniflux_health.status }}"
              - "Miniflux Login page: {{ miniflux_login_page.status }}"
              - "Miniflux API user: {{ miniflux_api_me.json.username }}"
              - "Miniflux API category write: {{ miniflux_api_category_created.status }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Miniflux systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=miniflux.service
          register: miniflux_service_log
          changed_when: false

        - name: Show the Miniflux systemd service log
          ansible.builtin.debug:
            var: miniflux_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Miniflux verification failed. The systemd service log is printed above."
