---
# Tasks shared by every scenario.

# The role is not included in this playbook, so its defaults are not in
# scope. Reading defaults/main.yml directly ties the version assertion
# below.
- name: Load the role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: cinny_defaults

- name: Wait for the Cinny systemd services to become active (up to 180s each)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
  register: cinny_services
  until: cinny_services.status.ActiveState == 'active'
  retries: 36
  delay: 5
  loop: "{{ cinny_verify_units }}"
  # So that giving up is reported by the assertion below rather than as a
  # wall of systemd unit properties.
  failed_when: false

# `Restart=always` in the systemd unit means that even a container which crashes
# and gets restarted reads as active here, so this is a precondition rather than
# a result.
- name: Assert the Cinny systemd services are active
  ansible.builtin.assert:
    that: cinny_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
    fail_msg: >-
      Not every service is active:
      {{ dict(cinny_verify_units | zip(cinny_services.results | map(attribute='status.ActiveState'))) }}
    success_msg: "Every systemd service is active"

- name: Retrieve the Cinny systemd services log for debugging
  when: cinny_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
  changed_when: false
  loop: "{{ cinny_verify_units }}"

# ------------------------------------------------------------------
# The container the role actually started
# ------------------------------------------------------------------

- name: Inspect the running Cinny container
  ansible.builtin.command:
    cmd: docker container inspect cinny
  register: cinny_container_raw
  changed_when: false

- name: Parse the Cinny container inspection
  ansible.builtin.set_fact:
    cinny_container: "{{ (cinny_container_raw.stdout | from_json)[0] }}"

# The systemd unit is what turns the role's variables into `docker create`
# arguments. Reading them back off the running container is what proves
# the values in the inventory reached the process, rather than merely
# having been written into a file somewhere.
- name: Assert the Cinny container runs as the configured user
  ansible.builtin.assert:
    that: cinny_container.Config.User == (cinny_uid | string) ~ ':' ~ (cinny_gid | string)
    fail_msg: "The Cinny container runs as {{ cinny_container.Config.User | default('(unset)') }}, expected {{ cinny_uid }}:{{ cinny_gid }}"
    success_msg: "The Cinny container runs as {{ cinny_container.Config.User }}"

- name: Assert the Cinny container is hardened as the systemd unit asks
  ansible.builtin.assert:
    that:
      - cinny_container.State.Running
      - cinny_container.HostConfig.ReadonlyRootfs
      - cinny_container.HostConfig.CapDrop == ['ALL']
    fail_msg: >-
      The Cinny container is not running with a read-only root filesystem and all capabilities dropped
      (running={{ cinny_container.State.Running }},
      read-only={{ cinny_container.HostConfig.ReadonlyRootfs }},
      dropped={{ cinny_container.HostConfig.CapDrop }})
    success_msg: "The Cinny container runs read-only with all capabilities dropped"

- name: Assert the running Cinny is the version this role installs
  ansible.builtin.assert:
    that: cinny_container.Config.Image | split(':') | last == cinny_defaults.cinny_version
    fail_msg: "Cinny reports {{ cinny_container.Config.Image | split(':') | last | default('none') }}, expected {{ cinny_defaults.cinny_version }}"
    success_msg: "Cinny reports {{ cinny_container.Config.Image | split(':') | last }}"

# ------------------------------------------------------------------
# What the role's nginx configuration serves
# ------------------------------------------------------------------

# The image's own vhost listens on port 80 and this role's `nginx.conf`
# listens on 8080 so that it can run as a non-root user, and the role's
# file does not include `conf.d`, so the image's vhost is never loaded.
# Anything answering here at all is therefore the role's configuration.
- name: Wait for the Cinny page to be served (up to 180s)
  ansible.builtin.uri:
    url: "{{ cinny_molecule_base_url }}/"
    method: GET
    # Nothing about a working Cinny involves a redirect, so following one
    # could only turn some other response into a misleading 200.
    follow_redirects: none
    status_code: "{{ cinny_molecule_http_status_codes }}"
    return_content: true
  register: cinny_index
  until: cinny_index.status == 200
  retries: 36
  delay: 5

- name: Assert the Cinny page is served
  ansible.builtin.assert:
    that:
      - cinny_index.status == 200
      - "'<title>Cinny</title>' in cinny_index.content"
    fail_msg: "The Cinny page was not served ({{ cinny_index.status }})"
    success_msg: "The Cinny page is served ({{ cinny_index.content | length }} bytes)"

# Cinny is a single-page application: every route that is not a real file
# has to come back as `index.html`. That fallback is a rewrite rule in the
# `nginx.conf` this role renders, so a deep route answering with the page
# is this role's routing working, not a static file happening to exist.
- name: Request a Cinny route that is not a file on disk
  ansible.builtin.uri:
    url: "{{ cinny_molecule_base_url }}/room/!molecule:example.com"
    method: GET
    follow_redirects: none
    status_code: "{{ cinny_molecule_http_status_codes }}"
    return_content: true
  register: cinny_spa_route
  changed_when: false

- name: Assert Cinny routes unknown paths to the application
  ansible.builtin.assert:
    that:
      - cinny_spa_route.status == 200
      - "'<title>Cinny</title>' in cinny_spa_route.content"
    fail_msg: "A Cinny route was not rewritten to the application ({{ cinny_spa_route.status }})"
    success_msg: "Cinny routes unknown paths to the application"

- name: Request the Cinny web application manifest
  ansible.builtin.uri:
    url: "{{ cinny_molecule_base_url }}/manifest.json"
    method: GET
    follow_redirects: none
    status_code: "{{ cinny_molecule_http_status_codes }}"
  register: cinny_manifest
  changed_when: false

- name: Assert the Cinny web application manifest is served
  ansible.builtin.assert:
    that:
      - cinny_manifest.status == 200
      - cinny_manifest.json.name == 'Cinny'
    fail_msg: "The Cinny manifest was not served ({{ cinny_manifest.status }})"
    success_msg: "The Cinny manifest is served"

# ------------------------------------------------------------------
# The configuration this role rendered, as the browser receives it
# ------------------------------------------------------------------

# A bare Cinny image ships its own `config.json` at this very path, so the
# request succeeding says nothing about the role. The assertions below are
# what separate the two: the file can only carry these values if the role
# rendered it and the systemd unit mounted it over the image's copy.
- name: Request the Cinny configuration
  ansible.builtin.uri:
    url: "{{ cinny_molecule_base_url }}/config.json"
    method: GET
    follow_redirects: none
    status_code: "{{ cinny_molecule_http_status_codes }}"
  register: cinny_served_config
  changed_when: false

- name: Assert the Cinny configuration is served
  ansible.builtin.assert:
    that: cinny_served_config.status == 200
    fail_msg: "The Cinny configuration was not served ({{ cinny_served_config.status }})"
    success_msg: "The Cinny configuration is served"

- name: Assert the served Cinny configuration carries the configured homeserver
  ansible.builtin.assert:
    that:
      - cinny_served_config.json.homeserverList == [cinny_default_hs_url]
      - cinny_served_config.json.defaultHomeserver == 0
    fail_msg: >-
      The served configuration lists {{ cinny_served_config.json.homeserverList }} defaulting to
      index {{ cinny_served_config.json.defaultHomeserver }}, expected {{ [cinny_default_hs_url] }} at index 0
    success_msg: "The served configuration lists only the configured homeserver"

- name: Assert the served Cinny configuration carries the configuration extension
  ansible.builtin.assert:
    that:
      - not cinny_served_config.json.allowCustomHomeservers
      - cinny_served_config.json.hashRouter.enabled
      - cinny_served_config.json.hashRouter.basename == '/molecule'
    fail_msg: "The served configuration does not carry the extension: {{ cinny_served_config.json }}"
    success_msg: "The served configuration carries the extension, combined into the role's own keys"

- name: Assert the served Cinny configuration carries the role's featured communities
  ansible.builtin.assert:
    that:
      - cinny_served_config.json.featuredCommunities.spaces == []
      - cinny_served_config.json.featuredCommunities.rooms == []
      - cinny_served_config.json.featuredCommunities.servers == ['matrix.org']
      - not cinny_served_config.json.featuredCommunities.openAsDefault
    fail_msg: "The served configuration does not carry the role's featured communities: {{ cinny_served_config.json.featuredCommunities }}"
    success_msg: "The served configuration carries the role's featured communities"

# ------------------------------------------------------------------
# The version of the application that is actually running
# ------------------------------------------------------------------

# Cinny builds its own version into its JavaScript bundle, and renders it
# in its about screen. The bundle's filename carries a content hash that
# changes with every release, so the only way to reach it is to read it
# off the page that references it. Unlike the image label, this holds for
# a self-built image too, because the value comes from the sources.
- name: Determine the Cinny application bundle that the page loads
  ansible.builtin.set_fact:
    # `regex_search` with a capture group hands back a list of groups, or
    # nothing at all when the page does not match. Joining covers both.
    cinny_bundle_url: "{{ (cinny_index.content | regex_search('src=\"(/assets/index-[^\"]+\\.js)\"', '\\1') | default([], true)) | join('') }}"

- name: Assert the Cinny page references an application bundle
  ansible.builtin.assert:
    that: cinny_bundle_url | length > 0
    fail_msg: "The served page references no application bundle: {{ cinny_index.content }}"
    success_msg: "The served page loads its application bundle from {{ cinny_bundle_url }}"

- name: Download the Cinny application bundle
  ansible.builtin.get_url:
    url: "{{ cinny_molecule_base_url }}{{ cinny_bundle_url }}"
    dest: "{{ cinny_molecule_bundle_path }}"
    mode: "0640"
  register: cinny_bundle_download

# The bundle is several megabytes, so it is searched on the host rather
# than pulled into a variable. Cinny renders its version as the text of a
# link to its releases page, which is what this pattern picks up.
- name: Read the version out of the Cinny application bundle
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import re
        import sys

        with open(sys.argv[1], encoding='utf-8', errors='replace') as handle:
            bundle = handle.read()

        print(' '.join(sorted(set(re.findall(r'children:"(v[0-9][^"]*)"', bundle)))))
      - "{{ cinny_molecule_bundle_path }}"
  register: cinny_bundle_version
  changed_when: false

- name: Assert the running Cinny is the version this role installs
  ansible.builtin.assert:
    that:
      - cinny_bundle_version.stdout_lines | length > 0
      - cinny_defaults.cinny_version in cinny_bundle_version.stdout.split()
    fail_msg: "Cinny reports {{ cinny_bundle_version.stdout | default('none') }}, expected {{ cinny_defaults.cinny_version }}"
    success_msg: "Cinny reports {{ cinny_bundle_version.stdout }}"

- name: Remove the downloaded Cinny application bundle
  ansible.builtin.file:
    path: "{{ cinny_molecule_bundle_path }}"
    state: absent

- name: Verify nothing was quietly restarting while all of that was being checked
  when: "cinny_restarts_check_enabled | bool"
  block:
    # `Restart=always` means the unit reads `active` while it is crash-looping,
    # so `active` on its own says very little. The window has to be watched with
    # everything already answering.
    - name: Sample the restart counters
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: cinny_restarts_before
      loop: "{{ cinny_verify_units }}"

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the services for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the restart counters again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: cinny_restarts_after
      loop: "{{ cinny_verify_units }}"

    - name: Assert no service restarted while it was up
      ansible.builtin.assert:
        that:
          - cinny_restarts_after.results | map(attribute='status.NRestarts') | list == cinny_restarts_before.results | map(attribute='status.NRestarts') | list
          - cinny_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
        fail_msg: >-
          A service restarted while it was supposedly up, so `active` was hiding a crash loop.
          Before:
          {% for unit, restarts in cinny_verify_units | zip(cinny_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
          after:
          {% for unit, restarts in cinny_verify_units | zip(cinny_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
        success_msg: >-
          None of the services restarted over 45 seconds of watching (restarts so far:
          {% for unit, restarts in cinny_verify_units | zip(cinny_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

- name: Show the Cinny verification summary
  ansible.builtin.debug:
    msg:
      - "Cinny systemd: {% for unit, state in cinny_verify_units | zip(cinny_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
      - "Cinny restarts: {% for unit, restarts in cinny_verify_units | zip(cinny_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
      - "Cinny container user: {{ cinny_container.Config.User }}"
      - "Cinny running version: {{ cinny_bundle_version.stdout }}"
      - "Cinny page size: {{ cinny_index.content | length }} bytes"
      - "Cinny bundle: {{ cinny_bundle_url }} ({{ cinny_bundle_download.size | default('unknown') }} bytes)"
      - "Cinny homeservers served: {{ cinny_served_config.json.homeserverList }}"
