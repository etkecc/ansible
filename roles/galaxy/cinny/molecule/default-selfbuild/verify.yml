---
- name: Verify self-built Cinny
  hosts: all
  become: true
  gather_facts: false

  vars:
    cinny_molecule_base_url: "http://127.0.0.1:{{ cinny_molecule_http_bind_port }}"
    cinny_molecule_bundle_path: /tmp/cinny-molecule-bundle.js

    cinny_verify_units:
      - cinny.service

  tasks:
    - name: Verify that Cinny works
      block:
        - name: Run the shared Cinny verification
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Cinny systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=cinny.service
          register: cinny_service_log
          changed_when: false

        - name: Show the Cinny systemd service log
          ansible.builtin.debug:
            var: cinny_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Cinny verification failed. The systemd service log is printed above."
