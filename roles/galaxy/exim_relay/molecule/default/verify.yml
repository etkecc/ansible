---
- name: Verify exim-relay
  hosts: all
  become: true
  gather_facts: false

  vars:
    exim_relay_verify_units:
      - exim-relay.service

  tasks:
    - name: Verify that exim-relay works
      block:
        # The probe below talks to the container by name on its own container
        # network and needs to know which image and which version the role just
        # installed. Reading the role defaults keeps the probe following whatever
        # Renovate bumps `exim_relay_version` to, instead of a pinned copy here.
        #
        # Beware: variables loaded this way outrank the scenario's inventory
        # group_vars, so anything the scenario configures (`exim_relay_hostname`,
        # for instance) reads back as its role default from here on. Only use the
        # variables below that describe the role itself, never the ones the
        # scenario tunes.
        - name: Load exim-relay role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"

        - name: Wait for the exim-relay systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: exim_relay_services
          until: exim_relay_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ exim_relay_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the exim-relay systemd services are active
          ansible.builtin.assert:
            that: exim_relay_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(exim_relay_verify_units | zip(exim_relay_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the exim-relay systemd services log for debugging
          when: exim_relay_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ exim_relay_verify_units }}"

        # A real ESMTP conversation, held from a throwaway container attached to
        # exim-relay's own container network - which is how actual consumers of
        # this role reach it. Using the exim-relay image itself for the probe
        # avoids pulling anything extra, since it is already present on the host
        # and ships a BusyBox `nc`.
        #
        # Exim runs unprivileged inside the container and therefore listens on
        # 8025 rather than on 25.
        #
        # Run through the docker CLI rather than community.docker.docker_container,
        # because the ansible-lint environment used by pre-commit does not have the
        # community.docker collection and would fail the syntax check.
        - name: Hold an SMTP conversation with exim-relay over its container network
          ansible.builtin.command:
            cmd: >-
              docker run --rm --network={{ exim_relay_container_network }}
              --entrypoint sh {{ exim_relay_container_image }}
              -c 'printf "EHLO molecule-probe\r\nMAIL FROM:<probe@example.com>\r\nRCPT TO:<probe@example.com>\r\nQUIT\r\n" | nc -w 10 {{ exim_relay_identifier }} 8025'
          register: exim_relay_smtp_conversation
          changed_when: false
          failed_when: false
          until: "'ESMTP Exim' in exim_relay_smtp_conversation.stdout"
          retries: 12
          delay: 5

        - name: Show the SMTP conversation
          ansible.builtin.debug:
            var: exim_relay_smtp_conversation.stdout_lines

        # The greeting banner names the Exim release that is actually running, so
        # this ties the test to the version the role installs rather than to
        # "some Exim answered". `exim_relay_version` carries an image revision
        # suffix (`4.99.1-r0-2`) that Exim itself knows nothing about.
        # The banner host name is the container's `--hostname`, which the systemd
        # unit sets from `exim_relay_identifier`.
        - name: Assert exim-relay greets as the expected host, running the expected Exim version
          vars:
            exim_relay_expected_version: "{{ exim_relay_version | regex_replace('-r[0-9]+.*$', '') }}"
            exim_relay_expected_banner: "220 {{ exim_relay_identifier }} ESMTP Exim {{ exim_relay_expected_version }} "
          ansible.builtin.assert:
            that: exim_relay_smtp_conversation.stdout_lines[0] is match('^' ~ (exim_relay_expected_banner | regex_escape))
            fail_msg: "Expected a banner starting with '{{ exim_relay_expected_banner }}', got '{{ exim_relay_smtp_conversation.stdout_lines[0] | default('none') }}'"
            success_msg: "exim-relay greeted with Exim {{ exim_relay_expected_version }}"

        - name: Assert exim-relay answers EHLO with the expected ESMTP capabilities
          ansible.builtin.assert:
            that:
              - "'250-' ~ exim_relay_identifier ~ ' Hello molecule-probe' in exim_relay_smtp_conversation.stdout"
              - "'250-SIZE' in exim_relay_smtp_conversation.stdout"
              - "'250-8BITMIME' in exim_relay_smtp_conversation.stdout"
              - "'250-PIPELINING' in exim_relay_smtp_conversation.stdout"
            fail_msg: "EHLO was not answered as expected"
            success_msg: "EHLO was answered with the expected ESMTP capabilities"

        # Reaching a routing decision (rather than a relay refusal) for a recipient
        # outside of the configured domains is what proves that
        # `exim_relay_relay_from_hosts` lets the container network through.
        # Nothing ever gets delivered: example.com publishes a null MX (RFC 7505),
        # and the session is closed before DATA anyway.
        - name: Assert exim-relay accepts the envelope sender and relays for the container network
          ansible.builtin.assert:
            that:
              - "'250 OK' in exim_relay_smtp_conversation.stdout"
              - "'relay not permitted' not in exim_relay_smtp_conversation.stdout"
              - "'221' in exim_relay_smtp_conversation.stdout"
            fail_msg: "exim-relay did not accept the envelope sender, or refused to relay for the container network"
            success_msg: "exim-relay accepted the envelope sender and relays for the container network"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "exim_relay_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: exim_relay_restarts_before
              loop: "{{ exim_relay_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: exim_relay_restarts_after
              loop: "{{ exim_relay_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - exim_relay_restarts_after.results | map(attribute='status.NRestarts') | list == exim_relay_restarts_before.results | map(attribute='status.NRestarts') | list
                  - exim_relay_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in exim_relay_verify_units | zip(exim_relay_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in exim_relay_verify_units | zip(exim_relay_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in exim_relay_verify_units | zip(exim_relay_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the exim-relay verification summary
          ansible.builtin.debug:
            msg:
              - "exim-relay systemd: {% for unit, state in exim_relay_verify_units | zip(exim_relay_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "exim-relay restarts: {% for unit, restarts in exim_relay_verify_units | zip(exim_relay_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "exim-relay SMTP banner: {{ exim_relay_smtp_conversation.stdout_lines[0] }}"
              - "exim-relay SMTP session lines: {{ exim_relay_smtp_conversation.stdout_lines | length }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the exim-relay systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=exim-relay.service
          register: exim_relay_service_log
          changed_when: false

        - name: Show the exim-relay systemd service log
          ansible.builtin.debug:
            var: exim_relay_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "exim-relay verification failed. The systemd service log is printed above."
