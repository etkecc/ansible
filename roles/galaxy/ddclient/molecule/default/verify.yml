---
- name: Verify ddclient
  hosts: all
  become: true
  gather_facts: false

  vars:
    # ddclient normally works out the address to publish by asking a discovery
    # service. The dry runs below hand it a fixed address instead, so that they
    # neither depend on nor perform such a lookup. This is TEST-NET-3, reserved
    # by RFC 5737 for documentation.
    ddclient_verify_probe_address: 203.0.113.5

    # A configuration that is deliberately not the one the role rendered, used
    # to show that the dry run reports what it reads rather than something
    # canned. Both names are in ranges that cannot resolve.
    ddclient_verify_decoy_provider: molecule-decoy-provider.invalid
    ddclient_verify_decoy_domain: molecule-decoy-host.example.org

    ddclient_verify_units:
      - ddclient.service

  tasks:
    - name: Verify that ddclient works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: ddclient_defaults

        - name: Wait for the ddclient systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: ddclient_services
          until: ddclient_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ ddclient_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the ddclient systemd services are active
          ansible.builtin.assert:
            that: ddclient_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(ddclient_verify_units | zip(ddclient_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the ddclient systemd services log for debugging
          when: ddclient_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ ddclient_verify_units }}"

        # Queried via the docker CLI rather than community.docker.docker_container_info,
        # because the ansible-lint environment used by pre-commit does not have the
        # community.docker collection and would fail the syntax check. The full JSON
        # is parsed here rather than using `--format`, whose Go templating would
        # collide with Jinja.
        - name: Inspect the running ddclient container
          ansible.builtin.command:
            cmd: docker container inspect ddclient
          register: ddclient_container_raw
          changed_when: false

        - name: Assert the ddclient container is running the image this role installs
          ansible.builtin.assert:
            that:
              - (ddclient_container_raw.stdout | from_json | first).State.Running
              - "':' ~ ddclient_defaults.ddclient_version in (ddclient_container_raw.stdout | from_json | first).Config.Image"
            fail_msg: "The ddclient container is not running linuxserver/ddclient:{{ ddclient_defaults.ddclient_version }}"
            success_msg: "The ddclient container is running linuxserver/ddclient:{{ ddclient_defaults.ddclient_version }}"

        # An active unit says very little on its own here. A ddclient container
        # given no usable configuration at all still starts, still reports itself
        # healthy and still sits there running, because ddclient treats a missing,
        # empty or syntactically broken configuration file as "nothing to do" and
        # exits 0. Everything below therefore checks what the daemon is configured
        # with, not merely that it is up.
        - name: Read the ddclient configuration file this role rendered
          ansible.builtin.slurp:
            src: "/{{ ddclient_defaults.ddclient_identifier }}/config/ddclient.conf"
          register: ddclient_config_file

        - name: Assert the rendered configuration carries what this scenario asked for
          ansible.builtin.assert:
            that:
              - "'server=' ~ ddclient_verify_provider in ddclient_config_file.content | b64decode"
              - "'protocol=' ~ ddclient_verify_protocol in ddclient_config_file.content | b64decode"
              - "ddclient_verify_domain in ddclient_config_file.content | b64decode"
              - "'daemon=' ~ ddclient_daemon_interval in ddclient_config_file.content | b64decode"
            fail_msg: "The rendered ddclient.conf does not describe {{ ddclient_verify_domain }} at {{ ddclient_verify_provider }}"
            success_msg: "The rendered ddclient.conf describes {{ ddclient_verify_domain }} at {{ ddclient_verify_provider }}"

        # The first of two independent ways of showing that the rendered file is
        # what the live daemon read, and the one that looks at the daemon itself.
        #
        # ddclient rewrites its own process title while it waits between passes, to
        # "ddclient - sleeping for N seconds", where N counts down from the
        # `daemon=` value of the configuration it loaded. The container image
        # installs its own fallback configuration whenever the role's file is not
        # there, and that fallback says `daemon=300`. A daemon sleeping on this
        # scenario's far longer interval is therefore one that read the role's
        # file, and could not be one that fell back.
        - name: Wait for the ddclient daemon to settle between passes (up to 120s)
          ansible.builtin.command:
            cmd: "docker exec {{ ddclient_defaults.ddclient_identifier }} ps -eo args"
          register: ddclient_process_list
          changed_when: false
          until: "'ddclient - sleeping for' in ddclient_process_list.stdout"
          retries: 24
          delay: 5

        - name: Determine the interval the running ddclient daemon is sleeping on
          ansible.builtin.set_fact:
            ddclient_sleep_seconds: >-
              {{
                ddclient_process_list.stdout
                | regex_search('ddclient - sleeping for ([0-9]+) seconds', '\1')
                | first | int
              }}

        - name: Assert the running daemon sleeps on the interval this role configured
          ansible.builtin.assert:
            that:
              - ddclient_sleep_seconds | int <= ddclient_daemon_interval | int
              - ddclient_sleep_seconds | int > 300
            fail_msg: >-
              The daemon sleeps {{ ddclient_sleep_seconds }}s, which does not belong to the configured
              {{ ddclient_daemon_interval }}s interval - it looks like the image's own fallback configuration
            success_msg: >-
              The daemon sleeps {{ ddclient_sleep_seconds }}s, which belongs to the configured
              {{ ddclient_daemon_interval }}s interval

        # The second way, and the one that shows what the configuration actually
        # means to ddclient rather than only that it arrived.
        #
        # `--noexec` makes ddclient parse the configuration, work out every request
        # it would send and print each one prefixed with "would request:", without
        # sending any of them - not the update, and not even the address lookup. So
        # this reports the provider, protocol and hostname the daemon is set up to
        # publish to while leaving the outside world untouched, which is the whole
        # of what can honestly be checked about a dynamic DNS updater.
        #
        # It reads /config/ddclient.conf, the very path the image's service script
        # passes to the daemon it supervises, so a run that reports this scenario's
        # provider is reading the same bytes the daemon did.
        #
        # ddclient writes all of this to stderr, and it does not exit on its own:
        # `daemon=` in the configuration file outranks `--daemon=0` on the command
        # line, so after one pass it goes to sleep. `timeout` inside the container
        # ends it once it has said what it would do, and the non-zero status that
        # produces is expected rather than a failure.
        - name: Ask ddclient what it would send, without letting it send anything
          ansible.builtin.command:
            cmd: >-
              docker exec {{ ddclient_defaults.ddclient_identifier }}
              timeout 30 ddclient
              --file /config/ddclient.conf
              --daemon=0 --foreground --noexec --force --verbose --noquiet
              --usev4=ipv4 --ipv4={{ ddclient_verify_probe_address }}
          register: ddclient_dry_run
          changed_when: false
          failed_when: false

        - name: Assert the dry run describes the update this scenario configured
          ansible.builtin.assert:
            that:
              - >-
                'would request: https://' ~ ddclient_verify_provider ~ '/nic/update?hostname=' ~ ddclient_verify_domain
                in ddclient_dry_run.stderr
              - "'[' ~ ddclient_verify_protocol ~ '][' ~ ddclient_verify_domain ~ ']' in ddclient_dry_run.stderr"
              - ddclient_verify_decoy_provider not in ddclient_dry_run.stderr
            fail_msg: >-
              The running daemon's configuration does not describe a {{ ddclient_verify_protocol }} update
              of {{ ddclient_verify_domain }} at {{ ddclient_verify_provider }}
            success_msg: >-
              The running daemon would send a {{ ddclient_verify_protocol }} update
              of {{ ddclient_verify_domain }} to {{ ddclient_verify_provider }}

        # The check above is only worth something if the same probe would report
        # something else when given something else. Pointing it at a configuration
        # naming a different provider and a different host, and seeing both of them
        # come back, rules out an assertion that passes on canned output.
        #
        # The file is written into the directory the role bind-mounts, so it shows
        # up inside the container without any need to shell text in. It gets its
        # own cache file, so that it cannot disturb the daemon's.
        - name: Install a decoy configuration for the falsification check
          ansible.builtin.copy:
            dest: "/{{ ddclient_defaults.ddclient_identifier }}/config/molecule-decoy.conf"
            mode: "0600"
            owner: "{{ ddclient_uid }}"
            group: "{{ ddclient_gid }}"
            content: |
              syslog=no
              protocol={{ ddclient_verify_protocol }}
              server={{ ddclient_verify_decoy_provider }}
              login='decoy'
              password='decoy'
              {{ ddclient_verify_decoy_domain }}

        - name: Ask ddclient what it would send for the decoy configuration
          ansible.builtin.command:
            cmd: >-
              docker exec {{ ddclient_defaults.ddclient_identifier }}
              timeout 30 ddclient
              --file /config/molecule-decoy.conf
              --cache /tmp/molecule-decoy.cache
              --daemon=0 --foreground --noexec --force --verbose --noquiet
              --usev4=ipv4 --ipv4={{ ddclient_verify_probe_address }}
          register: ddclient_decoy_dry_run
          changed_when: false
          failed_when: false

        - name: Remove the decoy configuration
          ansible.builtin.file:
            path: "/{{ ddclient_defaults.ddclient_identifier }}/config/molecule-decoy.conf"
            state: absent

        - name: Assert the dry run follows the configuration it is given
          ansible.builtin.assert:
            that: >-
              'would request: https://' ~ ddclient_verify_decoy_provider ~ '/nic/update?hostname=' ~ ddclient_verify_decoy_domain
              in ddclient_decoy_dry_run.stderr
            fail_msg: >-
              The dry run did not report the decoy provider, so the assertion above does not
              demonstrate that it reads the configuration it is pointed at
            success_msg: >-
              The dry run reports the decoy provider when given the decoy configuration,
              so it does read the configuration it is pointed at

        # ddclient reports the upstream version, which is what ddclient_version
        # names and what Renovate bumps.
        - name: Query the version of the running ddclient
          ansible.builtin.command:
            cmd: "docker exec {{ ddclient_defaults.ddclient_identifier }} ddclient --version"
          register: ddclient_version_reported
          changed_when: false

        - name: Assert the running ddclient is the version this role installs
          ansible.builtin.assert:
            that: ddclient_version_reported.stdout_lines | first == 'ddclient version ' ~ ddclient_defaults.ddclient_version
            fail_msg: "ddclient reports {{ ddclient_version_reported.stdout_lines | first | default('none') }}, expected {{ ddclient_defaults.ddclient_version }}"
            success_msg: "ddclient reports {{ ddclient_version_reported.stdout_lines | first }}"

        # A second, independent surface for the same thing, on the LinuxServer side
        # of the image rather than ddclient's own. This one is matched by prefix:
        # LinuxServer appends its own build counter to the upstream version, so the
        # value reads "v4.0.0-ls230" for a role installing 4.0.0, and the build
        # counter moves without the ddclient version moving.
        - name: Read the LinuxServer build version from the running container
          ansible.builtin.command:
            cmd: "docker exec {{ ddclient_defaults.ddclient_identifier }} cat /build_version"
          register: ddclient_build_version
          changed_when: false

        - name: Assert the image was built for the version this role installs
          ansible.builtin.assert:
            that: "'Linuxserver.io version: v' ~ ddclient_defaults.ddclient_version in ddclient_build_version.stdout"
            fail_msg: >-
              The image reports "{{ ddclient_build_version.stdout_lines | first }}",
              which was not built for ddclient {{ ddclient_defaults.ddclient_version }}
            success_msg: "The image was built for ddclient {{ ddclient_defaults.ddclient_version }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "ddclient_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: ddclient_restarts_before
              loop: "{{ ddclient_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: ddclient_restarts_after
              loop: "{{ ddclient_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - ddclient_restarts_after.results | map(attribute='status.NRestarts') | list == ddclient_restarts_before.results | map(attribute='status.NRestarts') | list
                  - ddclient_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in ddclient_verify_units | zip(ddclient_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in ddclient_verify_units | zip(ddclient_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in ddclient_verify_units | zip(ddclient_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the ddclient verification summary
          ansible.builtin.debug:
            msg:
              - "ddclient systemd: {% for unit, state in ddclient_verify_units | zip(ddclient_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "ddclient restarts: {% for unit, restarts in ddclient_verify_units | zip(ddclient_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "ddclient version: {{ ddclient_version_reported.stdout_lines | first }}"
              - "ddclient image build: {{ ddclient_build_version.stdout_lines | first }}"
              - "ddclient daemon sleeping on: {{ ddclient_sleep_seconds }}s of {{ ddclient_daemon_interval }}s"
              - "ddclient update: {{ ddclient_verify_domain }} at {{ ddclient_verify_provider }} via {{ ddclient_verify_protocol }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the ddclient systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=ddclient.service
          register: ddclient_service_log
          changed_when: false

        - name: Show the ddclient systemd service log
          ansible.builtin.debug:
            var: ddclient_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "ddclient verification failed. The systemd service log is printed above."
