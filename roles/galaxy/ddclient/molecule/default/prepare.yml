---
- name: Prepare ddclient Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for ddclient Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for ddclient Molecule tests preparation
      ansible.builtin.package:
        name:
          # Used by ansible.builtin.uri when it talks to ddclient.
          - python3-requests
        state: present

    - name: Ensure Docker is installed for ddclient Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker

    # Bind-mounted into the ddclient container through
    # `ddclient_container_additional_volumes_custom`. The role does not create the source
    # of an additional volume, so it has to exist before the container is
    # created, or `docker create` refuses the bind. verify.yml reads the marker
    # file back from inside the container, which only works if the systemd unit
    # really carries the additional volumes.
    - name: Ensure the additional volume directory exists for ddclient Molecule tests
      ansible.builtin.file:
        path: "{{ ddclient_molecule_extra_volume_src }}"
        state: directory
        mode: "0755"

    - name: Ensure a marker file exists in the ddclient Molecule additional volume
      ansible.builtin.copy:
        content: "{{ ddclient_molecule_extra_volume_marker }}\n"
        dest: "{{ ddclient_molecule_extra_volume_src }}/{{ ddclient_molecule_marker_filename }}"
        mode: "0644"
