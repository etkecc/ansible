---
- name: Include a task to detect installed PeerTube version
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/utils/detect_installed_version.yml"

- name: Ensure PeerTube paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0750"
    owner: "{{ peertube_uid }}"
    group: "{{ peertube_gid }}"
  with_items:
    - path: "{{ peertube_base_path }}"
      when: true
    - path: "{{ peertube_config_path }}"
      when: true
    - path: "{{ peertube_data_path }}"
      when: true
    - path: "{{ peertube_tmp_path }}"
      when: "{{ not peertube_container_tmpfs_tmp_enabled }}"
  when: item.when | bool

- name: Ensure PeerTube tmp path removed if tmp-on-tmpfs enabled
  when: peertube_container_tmpfs_tmp_enabled | bool
  ansible.builtin.file:
    path: "{{ peertube_tmp_path }}"
    state: absent

- name: Ensure PeerTube support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ peertube_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ peertube_uid }}"
    group: "{{ peertube_gid }}"
  with_items:
    - env
    - labels
  register: peertube_support_files_result

- name: Ensure PeerTube container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ peertube_container_image }}"
    pull: always
  register: peertube_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: peertube_container_image_pull_result_ansible_module is not failed

- name: Ensure PeerTube container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ peertube_container_image }}"
  register: peertube_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: peertube_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in peertube_container_image_pull_result_command.stdout"

- name: Ensure PeerTube container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ peertube_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: peertube_network_creation_result

- name: Ensure PeerTube container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ peertube_container_network }}
  register: peertube_network_creation_result
  changed_when: peertube_network_creation_result.rc == 0
  failed_when: peertube_network_creation_result.rc != 0 and 'already exists' not in peertube_network_creation_result.stderr

- name: Ensure PeerTube systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/peertube.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ peertube_identifier }}.service"
    mode: "0644"
  register: peertube_systemd_service_result

- name: Determine which PeerTube manual migration scripts need to be run
  ansible.builtin.set_fact:
    # For earlier versions, we were not storing the version in the marker file, so we don't really know the version.
    # We treat an unknown version as older than all of the scripts. Being 100% accurate here is not that important,
    # since the migration scripts are idempotent anyway.
    peertube_manual_migration_scripts_pending: |-
      {{
        peertube_manual_migration_scripts
        | selectattr('version', 'version', peertube_version, '<=')
        | rejectattr('version', 'version', (peertube_detected_version if peertube_detected_version != '' else 'v0.0.0'), '<=')
        | list
        if peertube_detected_existing_installation else []
      }}

- name: Run PeerTube manual migration scripts if needed
  when: peertube_manual_migration_scripts_pending | length > 0
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/utils/run_manual_migration_scripts.yml"

# This is intentionally done last, to ensure we only mark the version after it has been "more successfully" installed.
- name: Ensure PeerTube INSTALLED_VERSION file created
  ansible.builtin.template:
    src: "{{ role_path }}/templates/INSTALLED_VERSION.j2"
    dest: "{{ peertube_base_path }}/INSTALLED_VERSION"
    mode: "0640"
    owner: "{{ peertube_uid }}"
    group: "{{ peertube_gid }}"

- name: Determine whether PeerTube needs a restart
  ansible.builtin.set_fact:
    peertube_restart_necessary: >-
      {{
        peertube_support_files_result.changed | default(false)
        or peertube_systemd_service_result.changed | default(false)
        or peertube_container_image_pull_result_ansible_module.changed | default(false)
        or peertube_container_image_pull_result_command.changed | default(false)
      }}
