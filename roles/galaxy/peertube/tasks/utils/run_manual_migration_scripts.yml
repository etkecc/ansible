---
- name: Announce PeerTube manual migration scripts
  ansible.builtin.debug:
    msg: >-
      Upgrading PeerTube from version `{{ 'unknown' if peertube_detected_version == '' else peertube_detected_version }}`
      to `{{ peertube_version }}` requires running these migration scripts: {{ peertube_manual_migration_scripts_pending | map(attribute='name') | join(', ') }}

- name: Populate service facts
  ansible.builtin.service_facts:

- name: Set facts related to the service name
  ansible.builtin.set_fact:
    peertube_service_name: "{{ peertube_identifier + '.service' }}"

- name: Set facts related to a running PeerTube instance
  ansible.builtin.set_fact:
    peertube_was_running: "{{ ansible_facts.services[peertube_service_name] | default(none) is not none and ansible_facts.services[peertube_service_name].state == 'running' }}"

# We always restart, to ensure that PeerTube is powered by the newest version (that we just installed).
# Starting it is also what makes PeerTube run its database migrations, which these scripts must run after.
- name: Ensure PeerTube is restarted
  ansible.builtin.service:
    name: "{{ peertube_identifier }}"
    state: restarted
    daemon_reload: true

# PeerTube only starts serving HTTP requests after it has finished its database migrations,
# so answering is a reliable signal that the migration scripts can be run.
# Database migrations may take a long time for large instances, hence the generous timeout.
- name: Wait for PeerTube to finish its database migrations and start serving HTTP requests
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} exec
      {{ peertube_identifier }}
      curl --silent --fail --output /dev/null
      http://127.0.0.1:{{ peertube_container_http_port }}/api/v1/ping
  register: peertube_ping_result
  until: peertube_ping_result.rc == 0
  retries: "{{ (peertube_migration_wait_time | int / 10) | round(0, 'ceil') | int }}"
  delay: 10
  changed_when: false

- name: Run PeerTube manual migration scripts
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} exec
      --user={{ peertube_uid }}:{{ peertube_gid }}
      {{ peertube_identifier }}
      node dist/scripts/migrations/{{ item.name }}.js
  with_items: "{{ peertube_manual_migration_scripts_pending }}"
  async: "{{ peertube_migration_wait_time }}"
  poll: 10
  register: peertube_migration_command_result
  failed_when: not peertube_migration_command_result.finished or peertube_migration_command_result.rc != 0
  changed_when: peertube_migration_command_result.finished and peertube_migration_command_result.rc == 0

- name: Ensure PeerTube systemd service is stopped (if it previously was)
  when: not peertube_was_running
  ansible.builtin.service:
    name: "{{ peertube_identifier }}"
    state: stopped
