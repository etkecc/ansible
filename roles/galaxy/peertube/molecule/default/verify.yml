---
- name: Verify PeerTube
  hosts: all
  become: true
  gather_facts: false

  vars:
    # The port and the hostname come from the scenario's group_vars, not from here,
    # so that what gets asserted is the configuration the role was actually given.
    peertube_molecule_url: "http://127.0.0.1:{{ peertube_container_http_port }}"
    peertube_molecule_channel_name: molecule_channel
    peertube_molecule_channel_display_name: Molecule Channel

    peertube_verify_units:
      - peertube.service
      - postgres.service
      - valkey.service

  tasks:
    - name: Verify that PeerTube works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: peertube_defaults

        - name: Wait for the PeerTube systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: peertube_services
          until: peertube_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ peertube_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the PeerTube systemd services are active
          ansible.builtin.assert:
            that: peertube_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(peertube_verify_units | zip(peertube_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the PeerTube systemd services log for debugging
          when: peertube_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ peertube_verify_units }}"

        # `argv` rather than `cmd`, because a Go template holding a space would
        # otherwise be split into separate arguments and Docker would reject it.
        - name: Determine which image the PeerTube container runs
          ansible.builtin.command:
            argv:
              - docker
              - container
              - inspect
              - peertube
              - --format
              - "{{ '{{' }} .Config.Image {{ '}}' }}"
          register: peertube_container_image_result
          changed_when: false

        - name: Assert the running PeerTube is the version this role installs
          ansible.builtin.assert:
            that: >-
              peertube_container_image_result.stdout ==
              peertube_defaults.peertube_container_image_registry_prefix_upstream_default
              ~ 'chocobozzz/peertube:'
              ~ peertube_defaults.peertube_version
              ~ '-'
              ~ peertube_defaults.peertube_distro_variant
            fail_msg: "PeerTube reports {{ peertube_container_image_result.stdout | default('none') }}, expected {{ peertube_defaults.peertube_version }} with peertube_distro_variant ({{ peertube_defaults.peertube_distro_variant }})"
            success_msg: "PeerTube reports {{ peertube_container_image_result.stdout }}"

        # PeerTube's `listen.port` has no dedicated environment variable in the container
        # image and reaches it through NODE_CONFIG. The scenario configures a port that is
        # not PeerTube's own default, so nothing answers here unless that actually worked.
        - name: Wait for PeerTube to answer on the configured HTTP port
          ansible.builtin.uri:
            url: "{{ peertube_molecule_url }}/api/v1/config"
            method: GET
            headers:
              Host: "{{ peertube_hostname }}"
            follow_redirects: none
            status_code: [200]
          register: peertube_config_endpoint
          until: peertube_config_endpoint.status == 200
          retries: 120
          delay: 5

        - name: Assert the running PeerTube is the version this role installs
          ansible.builtin.assert:
            that: "peertube_config_endpoint.json.serverVersion == peertube_defaults.peertube_version | regex_replace('^v', '')"
            fail_msg: "PeerTube reports {{ peertube_config_endpoint.json.serverVersion | default('none') }}, expected {{ peertube_defaults.peertube_version }}"
            success_msg: "PeerTube reports {{ peertube_config_endpoint.json.serverVersion }}"

        # PeerTube hands out OAuth client credentials only to requests whose Host header
        # matches the hostname it was configured with. A PeerTube which never received
        # `peertube_hostname` would answer this one instead of refusing it.
        - name: Ask PeerTube for OAuth client credentials under a hostname it was not configured with
          ansible.builtin.uri:
            url: "{{ peertube_molecule_url }}/api/v1/oauth-clients/local"
            method: GET
            headers:
              Host: not.the.configured.hostname
            follow_redirects: none
            status_code: [200, 403]
          register: peertube_oauth_client_wrong_host

        - name: Assert PeerTube refuses OAuth client credentials under the wrong hostname
          ansible.builtin.assert:
            that: peertube_oauth_client_wrong_host.status == 403
            fail_msg: >-
              PeerTube handed out OAuth client credentials to a request for
              `not.the.configured.hostname`, so it is not serving `{{ peertube_hostname }}`
            success_msg: "PeerTube refuses OAuth client credentials under a foreign hostname"

        - name: Ask PeerTube for OAuth client credentials under the configured hostname
          ansible.builtin.uri:
            url: "{{ peertube_molecule_url }}/api/v1/oauth-clients/local"
            method: GET
            headers:
              Host: "{{ peertube_hostname }}"
            follow_redirects: none
            status_code: [200]
          register: peertube_oauth_client

        # PT_INITIAL_ROOT_PASSWORD is what the role passes. Had it not reached PeerTube,
        # PeerTube would have generated a password of its own and this would fail.
        - name: Log in to PeerTube as the root user the role created
          ansible.builtin.uri:
            url: "{{ peertube_molecule_url }}/api/v1/users/token"
            method: POST
            headers:
              Host: "{{ peertube_hostname }}"
            body_format: form-urlencoded
            body:
              client_id: "{{ peertube_oauth_client.json.client_id }}"
              client_secret: "{{ peertube_oauth_client.json.client_secret }}"
              grant_type: password
              response_type: code
              username: root
              password: "{{ peertube_config_root_user_initial_password }}"
            follow_redirects: none
            status_code: [200]
          register: peertube_token

        - name: Assert PeerTube issued an access token for the root user
          ansible.builtin.assert:
            that: peertube_token.json.access_token | default('') | length > 0
            fail_msg: "PeerTube did not issue an access token for the root user"
            success_msg: "PeerTube issued an access token for the root user"

        - name: Read the root user back from PeerTube
          ansible.builtin.uri:
            url: "{{ peertube_molecule_url }}/api/v1/users/me"
            method: GET
            headers:
              Host: "{{ peertube_hostname }}"
              Authorization: "Bearer {{ peertube_token.json.access_token }}"
            follow_redirects: none
            status_code: [200]
          register: peertube_me

        - name: Assert the root user carries the administrator e-mail address the role configured
          ansible.builtin.assert:
            that:
              - peertube_me.json.username == 'root'
              - peertube_me.json.email == peertube_config_admin_email
              - peertube_me.json.role.id == 0
            fail_msg: >-
              PeerTube's root user is {{ peertube_me.json.username }} <{{ peertube_me.json.email }}>,
              not an administrator with {{ peertube_config_admin_email }}
            success_msg: "PeerTube's root user is an administrator with {{ peertube_config_admin_email }}"

        - name: Create a video channel over the PeerTube API
          ansible.builtin.uri:
            url: "{{ peertube_molecule_url }}/api/v1/video-channels"
            method: POST
            headers:
              Host: "{{ peertube_hostname }}"
              Authorization: "Bearer {{ peertube_token.json.access_token }}"
            body_format: json
            body:
              name: "{{ peertube_molecule_channel_name }}"
              displayName: "{{ peertube_molecule_channel_display_name }}"
            follow_redirects: none
            # 409 is what PeerTube answers when the channel is already there, which is
            # what a second run of this play finds. The read-back below is what decides.
            status_code: [200, 409]
          register: peertube_channel_creation
          changed_when: peertube_channel_creation.status == 200

        - name: Read the video channel back over the PeerTube API
          ansible.builtin.uri:
            url: "{{ peertube_molecule_url }}/api/v1/video-channels/{{ peertube_molecule_channel_name }}"
            method: GET
            headers:
              Host: "{{ peertube_hostname }}"
            follow_redirects: none
            status_code: [200]
          register: peertube_channel

        - name: Assert PeerTube serves the video channel back under the configured hostname
          ansible.builtin.assert:
            that:
              - peertube_channel.json.displayName == peertube_molecule_channel_display_name
              - peertube_channel.json.host == peertube_hostname
              - peertube_channel.json.isLocal | bool
            fail_msg: >-
              PeerTube returned `{{ peertube_channel.json.displayName }}` on
              {{ peertube_channel.json.host }}, not `{{ peertube_molecule_channel_display_name }}`
              on {{ peertube_hostname }}
            success_msg: "PeerTube serves the video channel on {{ peertube_channel.json.host }}"

        # The channel has to be in the Postgres database the role pointed PeerTube at,
        # rather than in storage PeerTube picked for itself.
        - name: Look the video channel up in Postgres
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - --env
              - "PGPASSWORD={{ peertube_database_password }}"
              - postgres
              - psql
              - "--username={{ peertube_database_username }}"
              - "--dbname={{ peertube_database_name }}"
              - --no-align
              - --tuples-only
              - --command
              - >-
                SELECT actor."preferredUsername" || '=' || "videoChannel"."name"
                FROM "videoChannel"
                JOIN actor ON actor.id = "videoChannel"."actorId"
                WHERE actor."preferredUsername" = '{{ peertube_molecule_channel_name }}'
          register: peertube_database_lookup
          changed_when: false

        - name: Assert the video channel is stored in the Postgres database the role configured
          ansible.builtin.assert:
            that: >-
              peertube_database_lookup.stdout_lines
              == [peertube_molecule_channel_name ~ '=' ~ peertube_molecule_channel_display_name]
            fail_msg: >-
              The `{{ peertube_database_name }}` database does not hold the video channel
              (psql returned `{{ peertube_database_lookup.stdout }}`)
            success_msg: "The video channel is stored in the `{{ peertube_database_name }}` database"

        # PeerTube keeps serving HTTP with its data-store unreachable - it only logs
        # `Redis failed to connect` and retries - so the endpoints answering above say
        # nothing about Valkey. Its job queues do, and they are keyed by the hostname the
        # role configured, in the logical database the role configured.
        - name: Count PeerTube's job queue keys in the configured Valkey database
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - valkey
              - valkey-cli
              - "-n"
              - "{{ peertube_redis_db }}"
              - --scan
              - --pattern
              - "bull-{{ peertube_hostname }}:*"
          register: peertube_valkey_keys
          changed_when: false

        - name: Count the keys in Valkey's default database
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - valkey
              - valkey-cli
              - "-n"
              - "0"
              - DBSIZE
          register: peertube_valkey_default_database_size
          changed_when: false

        - name: Assert PeerTube drives its job queues through the configured Valkey database
          ansible.builtin.assert:
            that:
              - peertube_valkey_keys.stdout_lines | length > 0
              - peertube_valkey_default_database_size.stdout | trim | int == 0
            fail_msg: >-
              Valkey database {{ peertube_redis_db }} holds
              {{ peertube_valkey_keys.stdout_lines | length }} `bull-{{ peertube_hostname }}:*` keys
              and database 0 holds {{ peertube_valkey_default_database_size.stdout | trim }} keys -
              PeerTube is not using the data-store the way the role configured it
            success_msg: >-
              Valkey database {{ peertube_redis_db }} holds
              {{ peertube_valkey_keys.stdout_lines | length }} of PeerTube's job queue keys

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "peertube_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: peertube_restarts_before
              loop: "{{ peertube_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: peertube_restarts_after
              loop: "{{ peertube_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - peertube_restarts_after.results | map(attribute='status.NRestarts') | list == peertube_restarts_before.results | map(attribute='status.NRestarts') | list
                  - peertube_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in peertube_verify_units | zip(peertube_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in peertube_verify_units | zip(peertube_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in peertube_verify_units | zip(peertube_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the PeerTube verification summary
          ansible.builtin.debug:
            msg:
              - "PeerTube systemd: {% for unit, state in peertube_verify_units | zip(peertube_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "PeerTube restarts: {% for unit, restarts in peertube_verify_units | zip(peertube_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "PeerTube version: {{ peertube_config_endpoint.json.serverVersion }}"
              - "PeerTube image: {{ peertube_container_image_result.stdout }}"
              - "PeerTube listening on: {{ peertube_molecule_url }} as {{ peertube_hostname }}"
              - "PeerTube administrator: {{ peertube_me.json.username }} <{{ peertube_me.json.email }}>"
              - "PeerTube channel in Postgres: {{ peertube_database_lookup.stdout }}"
              - "PeerTube job queue keys in Valkey database {{ peertube_redis_db }}: {{ peertube_valkey_keys.stdout_lines | length }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the PeerTube systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=peertube.service
          register: peertube_service_log
          changed_when: false

        - name: Show the PeerTube systemd service log
          ansible.builtin.debug:
            var: peertube_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "PeerTube verification failed. The systemd service log is printed above."
