---
- name: Prepare PeerTube Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for PeerTube Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for PeerTube Molecule tests preparation
      ansible.builtin.package:
        name:
          # Used by the `ansible.builtin.uri` calls in verify.yml
          - python3-requests
          # The storage driver below. Docker in a container cannot use the
          # host's overlayfs, and fuse-overlayfs is several times faster than
          # falling back to vfs.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for PeerTube Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          # `vfs` makes a full copy of every layer. The PeerTube image is large
          # enough for that to dominate the run - `fuse-overlayfs` gives the same
          # nested-container isolation without the copying.
          storage-driver: fuse-overlayfs
