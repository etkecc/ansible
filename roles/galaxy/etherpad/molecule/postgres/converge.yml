---
- name: Include roles for Etherpad Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for Etherpad Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-postgres
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure Postgres systemd service is started
      ansible.builtin.systemd_service:
        name: postgres.service
        state: started

    # Etherpad is configured to authenticate API calls with a key, which it
    # reads from a file bind-mounted from here (see molecule.yml). The file has
    # to exist before the container is created, because `docker create` refuses
    # a `--mount type=bind` whose source is missing.
    - name: Ensure the Etherpad API key file exists
      ansible.builtin.copy:
        content: "{{ etherpad_molecule_api_key }}"
        dest: "{{ etherpad_molecule_api_key_path }}"
        mode: "0640"
        owner: "{{ etherpad_uid }}"
        group: "{{ etherpad_gid }}"

    - name: Ensure Etherpad systemd service is started
      ansible.builtin.systemd_service:
        name: etherpad.service
        state: started
