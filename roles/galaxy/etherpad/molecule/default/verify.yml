---
- name: Verify Etherpad
  hosts: all
  become: true
  gather_facts: false

  vars:
    etherpad_verify_base_url: "http://localhost:9001"

    etherpad_verify_units:
      - etherpad.service

  tasks:
    - name: Verify that Etherpad works
      block:
        - name: Run the checks shared by all Etherpad scenarios
          ansible.builtin.include_tasks:
            file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        # This scenario runs on SQLite, whose entire database is the file below, on
        # the host side of the /data bind mount. Finding the pad's key in it proves
        # both that the bind mount is wired up and that the pad really left the
        # process. ueberdb flushes writes in the background, hence the retries.
        - name: Look for the pad in the SQLite database file
          ansible.builtin.command:
            cmd: grep -a -c "pad:{{ etherpad_molecule_pad_id }}" {{ etherpad_molecule_base_path }}/data/db.sqlite
          register: etherpad_sqlite_matches
          changed_when: false
          failed_when: false
          until: etherpad_sqlite_matches.rc == 0
          retries: 12
          delay: 5

        - name: Assert the pad was persisted into the SQLite database file
          ansible.builtin.assert:
            that: etherpad_sqlite_matches.rc == 0
            fail_msg: "{{ etherpad_molecule_base_path }}/data/db.sqlite holds no record of pad '{{ etherpad_molecule_pad_id }}'"
            success_msg: "{{ etherpad_molecule_base_path }}/data/db.sqlite holds the pad that was written"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "etherpad_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: etherpad_restarts_before
              loop: "{{ etherpad_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: etherpad_restarts_after
              loop: "{{ etherpad_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - etherpad_restarts_after.results | map(attribute='status.NRestarts') | list == etherpad_restarts_before.results | map(attribute='status.NRestarts') | list
                  - etherpad_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in etherpad_verify_units | zip(etherpad_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in etherpad_verify_units | zip(etherpad_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in etherpad_verify_units | zip(etherpad_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Etherpad verification summary
          ansible.builtin.debug:
            msg:
              - "Etherpad systemd: {% for unit, state in etherpad_verify_units | zip(etherpad_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Etherpad restarts: {% for unit, restarts in etherpad_verify_units | zip(etherpad_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Etherpad version: {{ (etherpad_package_manifest.stdout | from_json).version }}"
              - "Etherpad index page: HTTP {{ etherpad_index_page.status }}, titled '{{ etherpad_configuration_title }}'"
              - "Etherpad pad round-trip: {{ etherpad_api_get_text.json.data.text | trim | to_json }}"
              - "Etherpad pad export: HTTP {{ etherpad_pad_export.status }}"
              - "Etherpad ueberdb writes to the database: {{ etherpad_stats.json.ueberdb_writesToDbFinished }}"
              - "Etherpad database backend: SQLite at {{ etherpad_molecule_base_path }}/data/db.sqlite"
              - "Etherpad API key: a wrong key is rejected, the one from {{ etherpad_molecule_api_key_path }} is accepted"
              - "Etherpad API version: {{ etherpad_api_version_reported.json.currentVersion }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Etherpad systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=etherpad.service
          register: etherpad_service_log
          changed_when: false

        - name: Show the Etherpad systemd service log
          ansible.builtin.debug:
            var: etherpad_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Etherpad verification failed. The systemd service log is printed above."
