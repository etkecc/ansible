---
- name: Ensure LanguageTool paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ languagetool_uid }}"
    group: "{{ languagetool_gid }}"
  with_items:
    - "{{ languagetool_base_path }}"
    - "{{ languagetool_data_path }}"

- name: Ensure LanguageTool support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ languagetool_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ languagetool_uid }}"
    group: "{{ languagetool_gid }}"
  with_items:
    - env
    - labels
  register: languagetool_support_files_result

- name: Install n-grams data files
  ansible.builtin.include_tasks: ngrams.yml
  with_items: "{{ languagetool_ngrams_langs_enabled }}"
  when: languagetool_ngrams_enabled | bool
  register: languagetool_ngram_data_files_result

- name: Ensure LanguageTool container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ languagetool_container_image }}"
    pull: always
  register: languagetool_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: languagetool_container_image_pull_result_ansible_module is not failed

- name: Ensure LanguageTool container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ languagetool_container_image }}"
  register: languagetool_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: languagetool_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in languagetool_container_image_pull_result_command.stdout"

- name: Ensure LanguageTool container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ languagetool_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: languagetool_network_creation_result

- name: Ensure LanguageTool container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ languagetool_container_network }}
  register: languagetool_network_creation_result
  changed_when: languagetool_network_creation_result.rc == 0
  failed_when: languagetool_network_creation_result.rc != 0 and 'already exists' not in languagetool_network_creation_result.stderr

- name: Ensure LanguageTool systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/languagetool.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ languagetool_identifier }}.service"
    mode: "0644"
  register: languagetool_systemd_service_result

- name: Determine whether LanguageTool needs a restart
  ansible.builtin.set_fact:
    languagetool_restart_necessary: >-
      {{
        languagetool_support_files_result.changed | default(false)
        or languagetool_ngram_data_files_result.changed | default(false)
        or languagetool_systemd_service_result.changed | default(false)
        or languagetool_container_image_pull_result_ansible_module.changed | default(false)
        or languagetool_container_image_pull_result_command.changed | default(false)
      }}
