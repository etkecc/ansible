# Runs the role twice.
#
# A swap file is expensive to create and destructive to recreate: rewriting it
# would blank a live swap area, and resizing it on a host whose fstab already
# points at it is how a machine ends up unable to swap after a reboot. The role
# guards against that with a `stat` and a `creates:`, and the cheapest honest way
# to test a guard is to run into it. The state recorded between the two runs is
# what verify.yml compares against.

---
- name: Include the swap role for the Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include the swap role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"

    - name: Record the state of the swap files after the first run
      ansible.builtin.stat:
        path: "{{ item.path }}"
        checksum_algorithm: sha256
      register: swap_molecule_after_first_run
      loop: "{{ swap_molecule_expected_files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Assert that the first run created the swap files
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "{{ item.item.path }} does not exist after the role's first run"
        success_msg: "{{ item.item.path }} was created by the role's first run"
      loop: "{{ swap_molecule_after_first_run.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    # Handed to verify.yml through the filesystem, since the two run as separate
    # playbooks and share no facts. Keyed by path, so that each file is compared
    # with itself and not with its neighbour.
    - name: Save the state of the swap files for the verification play
      ansible.builtin.copy:
        dest: /var/lib/molecule-swap-first-run.json
        mode: "0644"
        content: >-
          {{
            dict(
              swap_molecule_after_first_run.results | map(attribute='item.path')
              | zip(swap_molecule_after_first_run.results | map(attribute='stat'))
            ) | to_nice_json
          }}


# A second play rather than a second `include_role` in the first one: Ansible
# keeps a per-play cache of the roles it has already run and would skip a repeat
# with identical parameters, which would turn the whole point of this file into
# a no-op that nothing notices.
- name: Include the swap role a second time
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Include the swap role again
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
