---

# Swap files are added before any are removed, so that `swapoff` has somewhere to move pages to.
- name: Ensure swap files are present
  when: swap_file.state | default('present') == 'present'
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/util/ensure_swap_file_present.yml"
  with_items: "{{ system_swap_files }}"
  loop_control:
    loop_var: swap_file

- name: Ensure unwanted swap files are absent
  when: swap_file.state | default('present') == 'absent'
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/util/ensure_swap_file_absent.yml"
  with_items: "{{ system_swap_files }}"
  loop_control:
    loop_var: swap_file

- name: Set sysctl params
  ignore_errors: "{{ system_swap_ignore_errors }}"
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-swap.conf
    state: present
    reload: true
  with_items: "{{ system_swap_sysctl }}"
