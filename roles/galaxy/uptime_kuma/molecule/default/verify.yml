---
- name: Verify Uptime Kuma
  hosts: all
  become: true
  gather_facts: false

  vars:
    uptime_kuma_verify_units:
      - uptime-kuma.service

  tasks:
    - name: Verify that Uptime Kuma works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: uptime_kuma_defaults

        - name: Wait for the Uptime Kuma systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: uptime_kuma_services
          until: uptime_kuma_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ uptime_kuma_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Uptime Kuma systemd services are active
          ansible.builtin.assert:
            that: uptime_kuma_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(uptime_kuma_verify_units | zip(uptime_kuma_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Uptime Kuma systemd services log for debugging
          when: uptime_kuma_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ uptime_kuma_verify_units }}"

        # This only establishes that something is listening, and deliberately
        # asserts nothing about it. Uptime Kuma answers 200 with the same
        # application shell on every path, including paths that do not exist, so an
        # HTTP response here is not evidence that Uptime Kuma is what answered, nor
        # that it is configured. The Socket.IO probe below is what establishes that.
        - name: Wait for the Uptime Kuma port to start answering (up to 10m)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ uptime_kuma_container_http_host_bind_port }}/"
            method: GET
          register: uptime_kuma_port
          until: uptime_kuma_port.status == 200
          retries: 120
          delay: 5

        # Completes the setup wizard, logs in as the admin it created and reads back
        # what the running server reports about itself. See the script for why none
        # of this is reachable over plain HTTP.
        - name: Probe the Uptime Kuma Socket.IO API
          ansible.builtin.script:
            cmd: >-
              files/probe-uptime-kuma.py
              http://127.0.0.1:{{ uptime_kuma_container_http_host_bind_port }}
              {{ uptime_kuma_molecule_admin_username | quote }}
              {{ uptime_kuma_molecule_admin_password | quote }}
          register: uptime_kuma_probe
          changed_when: false

        - name: Parse the Uptime Kuma probe report
          ansible.builtin.set_fact:
            uptime_kuma_report: "{{ uptime_kuma_probe.stdout | from_json }}"

        # The admin is written into the SQLite database under `/app/data`, which is
        # the directory this role creates, chowns to the configured uid/gid and
        # bind-mounts into the container. A wrong mount or wrong ownership fails
        # here rather than passing silently.
        - name: Assert the Uptime Kuma setup wizard could be completed
          ansible.builtin.assert:
            that:
              - uptime_kuma_report.ok
              - uptime_kuma_report.setup_completed or uptime_kuma_report.already_configured
              - uptime_kuma_report.login_ok
              - uptime_kuma_report.token_returned
            fail_msg: "Uptime Kuma could not be set up and logged into: {{ uptime_kuma_report }}"
            success_msg: "Uptime Kuma accepted the setup wizard and issued a session token"

        # Uptime Kuma withholds its version from anonymous connections, so this is
        # the version the running Node process reports about itself once
        # authenticated, not a tag name read back from Docker.
        - name: Assert the running Uptime Kuma is the version this role installs
          ansible.builtin.assert:
            that: uptime_kuma_report.info.version == uptime_kuma_defaults.uptime_kuma_version
            fail_msg: "Uptime Kuma reports {{ uptime_kuma_report.info.version | default('none') }}, expected {{ uptime_kuma_defaults.uptime_kuma_version }}"
            success_msg: "Uptime Kuma reports {{ uptime_kuma_report.info.version }}"

        # `uptime_kuma_environment_variables_tz` and
        # `uptime_kuma_environment_variables_additional_variables` are both rendered
        # into `templates/env.j2`, which the systemd unit passes as `--env-file`.
        # The scenario sets both to non-default values, so these two assertions fail
        # if that chain is broken anywhere between the role defaults and the process.
        - name: Assert the environment file reached the Uptime Kuma process
          ansible.builtin.assert:
            that:
              - uptime_kuma_report.info.serverTimezone == uptime_kuma_environment_variables_tz
              - uptime_kuma_report.info.isContainer
            fail_msg: >-
              Uptime Kuma reports timezone {{ uptime_kuma_report.info.serverTimezone }}
              (expected {{ uptime_kuma_environment_variables_tz }})
              and isContainer {{ uptime_kuma_report.info.isContainer }} (expected true)
            success_msg: >-
              Uptime Kuma runs with the configured timezone
              ({{ uptime_kuma_report.info.serverTimezone }}) and additional environment variables

        - name: Inspect the Uptime Kuma container
          ansible.builtin.command:
            cmd: docker container inspect uptime-kuma
          register: uptime_kuma_container_raw
          changed_when: false

        - name: Parse the Uptime Kuma container definition
          ansible.builtin.set_fact:
            uptime_kuma_container: "{{ uptime_kuma_container_raw.stdout | from_json | first }}"

        # `templates/labels.j2` is passed to the container as `--label-file`. The
        # scenario adds labels through
        # `uptime_kuma_container_labels_additional_labels_custom`, so finding them
        # on the running container proves that file is rendered and applied.
        - name: Assert the label file reached the Uptime Kuma container
          ansible.builtin.assert:
            # Subscripting a missing label raises instead of failing the assertion,
            # which would bury `fail_msg` under a Jinja error, so ask for it.
            that:
              - uptime_kuma_container.Config.Labels.get('mash.molecule.role') == 'uptime-kuma'
              - uptime_kuma_container.Config.Labels.get('mash.molecule.scenario') == 'default'
            fail_msg: "The configured container labels are missing: {{ uptime_kuma_container.Config.Labels }}"
            success_msg: "The configured container labels are applied to the running container"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "uptime_kuma_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: uptime_kuma_restarts_before
              loop: "{{ uptime_kuma_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: uptime_kuma_restarts_after
              loop: "{{ uptime_kuma_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - uptime_kuma_restarts_after.results | map(attribute='status.NRestarts') | list == uptime_kuma_restarts_before.results | map(attribute='status.NRestarts') | list
                  - uptime_kuma_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in uptime_kuma_verify_units | zip(uptime_kuma_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in uptime_kuma_verify_units | zip(uptime_kuma_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in uptime_kuma_verify_units | zip(uptime_kuma_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Uptime Kuma verification summary
          ansible.builtin.debug:
            msg:
              - "Uptime Kuma systemd: {% for unit, state in uptime_kuma_verify_units | zip(uptime_kuma_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Uptime Kuma restarts: {% for unit, restarts in uptime_kuma_verify_units | zip(uptime_kuma_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Uptime Kuma version: {{ uptime_kuma_report.info.version }}"
              - "Uptime Kuma setup wizard offered: {{ uptime_kuma_report.setup_offered }}"
              - "Uptime Kuma admin created by this run: {{ uptime_kuma_report.setup_completed }}"
              - "Uptime Kuma timezone: {{ uptime_kuma_report.info.serverTimezone }}"
              - "Uptime Kuma container labels: {{ uptime_kuma_container.Config.Labels }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Uptime Kuma systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=uptime-kuma.service
          register: uptime_kuma_service_log
          changed_when: false

        - name: Show the Uptime Kuma systemd service log
          ansible.builtin.debug:
            var: uptime_kuma_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Uptime Kuma verification failed. The systemd service log is printed above."
