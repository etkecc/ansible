---
- name: Verify Radicale
  hosts: all
  become: true
  gather_facts: false
  vars:
    radicale_molecule_base_url: "http://127.0.0.1:{{ radicale_molecule_bind_port }}"

    # A minimal but complete VCALENDAR. Radicale rejects anything it cannot
    # parse, so a successful PUT already says the event was understood.
    radicale_molecule_event_body: |
      BEGIN:VCALENDAR
      VERSION:2.0
      PRODID:-//Molecule//Radicale Role Test//EN
      BEGIN:VEVENT
      UID:{{ radicale_molecule_event_uid }}
      DTSTAMP:20260101T000000Z
      DTSTART:20260101T120000Z
      DTEND:20260101T130000Z
      SUMMARY:Molecule round-trip event
      END:VEVENT
      END:VCALENDAR
  tasks:
    - name: Run the checks shared by all Radicale scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
