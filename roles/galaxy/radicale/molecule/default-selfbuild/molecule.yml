---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: radicale-${MOLECULE_DISTRO:-ubuntu2604}-default-selfbuild
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        radicale_debug_service_enabled: false

        # The port on the host that Radicale is published on.
        radicale_molecule_bind_port: 5232

        # The name of the container that the role creates, which is what
        # `radicale_identifier` defaults to. `verify.yml` asks it for its version.
        radicale_molecule_container_name: radicale

        # The command that reports the version of the running Radicale, and how
        # many dot-separated components of `radicale_version` it can be compared
        # against.
        #
        # The self-built image comes out of Radicale's own `Dockerfile`, which
        # installs into a virtualenv at `/app` whose console scripts still carry
        # the shebang of the build stage. Radicale therefore has to be started
        # through the interpreter, the same way that image's entrypoint does.
        #
        # The role builds it from the first three components of `radicale_version`
        # (image 3.7.6.0 packages Radicale 3.7.6), so the same three are what the
        # running version is compared against.
        radicale_molecule_version_command: /app/bin/python /app/bin/radicale --version
        radicale_molecule_version_components: 3

        # Where the `[storage] filesystem_folder` setting in the configuration
        # the role generates makes Radicale keep collections, as seen from the
        # host through the `/data` bind mount, plus the subfolder Radicale
        # creates underneath it.
        #
        # Spelled out literally, because `verify.yml` does not include the role
        # and so cannot resolve the role's derived default. Should the role's
        # defaults ever stop resolving to this, the storage probe fails loudly
        # rather than quietly checking nothing.
        radicale_molecule_collections_path: /radicale/data/collections
        radicale_molecule_collection_root_subdir: collection-root

        # The calendar collection and event that the DAV round-trip in
        # `verify.yml` creates. The UID is distinctive enough that finding it
        # again can only mean Radicale really stored what was sent to it.
        radicale_molecule_calendar_name: molecule-calendar
        radicale_molecule_event_uid: molecule-roundtrip-6f1b9c2a

        # Variables for Radicale
        radicale_uid: 1000
        radicale_gid: 1000
        radicale_hostname: localhost
        radicale_container_labels_traefik_enabled: false
        radicale_container_http_host_bind_port: "127.0.0.1:5232"

        # Test self-building
        radicale_container_image_self_build: true

        # The test user's credentials are deliberately NOT defined here.
        # A bcrypt password hash is full of dollar signs, and Molecule expands
        # anything looking like an environment variable in this file.
        # `converge.yml` and `verify.yml` read them from `vars/credentials.yml`
        # instead, where nothing interpolates them.
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
