---
# Credentials of the throwaway user that this scenario authenticates as.
#
# They live in this file rather than in `molecule.yml`, because Molecule
# expands anything that looks like an environment variable in `molecule.yml`,
# and a bcrypt hash is full of dollar signs. `converge.yml` and `verify.yml`
# read this file with `include_vars`, which interpolates nothing.
#
# The hash below is the bcrypt digest of `radicale_molecule_password`, produced
# with the same Radicale release the role installs:
#
#   docker run --rm --entrypoint /venv/bin/python \
#     docker.io/tomsquest/docker-radicale:3.7.6.0 \
#     -c "import bcrypt; print(bcrypt.hashpw(b'molecule-test-password', bcrypt.gensalt(rounds=10)).decode())"
#
# Radicale auto-detects the hashing scheme of each entry, so a bcrypt digest
# needs no further configuration.

radicale_molecule_username: molecule
radicale_molecule_password: molecule-test-password
radicale_molecule_password_hash: '$2b$10$GoLW2TSdss7XoO2Xok1twuINmWvpqrTjun/u7BLwNj.lCPPgn19h2'

# `radicale_htpasswds` takes whole `htpasswd -nb <user> <password>` lines, which
# the role templates into the htpasswd file that its generated configuration
# points Radicale at.
radicale_htpasswds:
  - "{{ radicale_molecule_username }}:{{ radicale_molecule_password_hash }}"
