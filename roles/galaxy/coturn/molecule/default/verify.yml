---
- name: Verify coturn
  hosts: all
  become: true
  gather_facts: false

  vars:
    coturn_verify_units:
      - coturn.service

  tasks:
    - name: Verify that coturn works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: coturn_defaults

        - name: Wait for the coturn systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: coturn_services
          until: coturn_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ coturn_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the coturn systemd services are active
          ansible.builtin.assert:
            that: coturn_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(coturn_verify_units | zip(coturn_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the coturn systemd services log for debugging
          when: coturn_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ coturn_verify_units }}"

        # The version has to be asked of the binary, because turnserver.conf enables
        # `prod`, which is what stops coturn from advertising its version in the
        # SOFTWARE attribute of the STUN responses probed above.
        - name: Query the version of the running coturn
          ansible.builtin.command:
            cmd: "docker exec {{ coturn_defaults.coturn_identifier }} turnserver --version"
          register: coturn_version_reported
          changed_when: false

        - name: Assert the running coturn is the version this role installs
          ansible.builtin.assert:
            that: (coturn_version_reported.stdout | trim).startswith(coturn_defaults.coturn_version | string)
            fail_msg: "coturn reports {{ coturn_version_reported.stdout | trim | default('none') }}, expected {{ coturn_defaults.coturn_version }}"
            success_msg: "coturn reports {{ coturn_version_reported.stdout | trim }}"

        # Answering a STUN Binding request is the cheapest thing the
        # TURN/STUN server itself can do, so it is the first probe here that proves
        # a serving coturn rather than a merely running container.
        #
        # The request is a hand-built 20-byte STUN packet, because the test
        # container ships no STUN client (and no curl). A UDP port that nothing
        # listens on swallows the packet and this times out, so a pass here cannot
        # come from anything but coturn.
        #
        # community.docker is deliberately avoided throughout this playbook: the
        # linting environment in CI has no collections installed.
        - name: Send a STUN Binding request to coturn over UDP (up to 120s)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import socket

                # A Binding request is a bare 20-byte STUN header: message type
                # 0x0001, a zero-length body, the RFC 5389 magic cookie, and a
                # 12-byte transaction ID that the response must echo back.
                request = (
                    b"\x00\x01\x00\x00"
                    b"\x21\x12\xa4\x42"
                    b"MOLECULESTUN"
                )

                sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                sock.settimeout(5)
                sock.sendto(request, ("127.0.0.1", 3478))
                response, _ = sock.recvfrom(2048)

                attributes = {}
                offset = 20
                end = 20 + int.from_bytes(response[2:4], "big")
                while offset + 4 <= end:
                    attribute_type = int.from_bytes(response[offset:offset + 2], "big")
                    length = int.from_bytes(response[offset + 2:offset + 4], "big")
                    attributes[attribute_type] = response[offset + 4:offset + 4 + length]
                    # Attribute values are padded to a multiple of four bytes.
                    offset += 4 + length + (-length % 4)

                # XOR-MAPPED-ADDRESS (0x0020) carries the address coturn saw the
                # request come from, obfuscated by XOR-ing it with the cookie.
                mapped = attributes.get(0x0020, b"")
                address = "none"
                if len(mapped) == 8 and mapped[1] == 0x01:
                    address = "%s:%d" % (
                        socket.inet_ntoa(bytes(a ^ b for a, b in zip(mapped[4:8], b"\x21\x12\xa4\x42"))),
                        int.from_bytes(mapped[2:4], "big") ^ 0x2112,
                    )

                print("type=0x%04x cookie=%s txid=%s xor_mapped_address=%s" % (
                    int.from_bytes(response[0:2], "big"),
                    "ok" if response[4:8] == b"\x21\x12\xa4\x42" else "bad",
                    "ok" if response[8:20] == request[8:20] else "bad",
                    address,
                ))
          register: coturn_stun_udp
          changed_when: false
          until: coturn_stun_udp.rc == 0 and 'type=0x0101' in coturn_stun_udp.stdout
          retries: 24
          delay: 5

        - name: Assert coturn answered the STUN Binding request over UDP
          ansible.builtin.assert:
            that:
              # 0x0101 is a Binding success response; an error would be 0x0111.
              - "'type=0x0101' in coturn_stun_udp.stdout"
              - "'cookie=ok' in coturn_stun_udp.stdout"
              - "'txid=ok' in coturn_stun_udp.stdout"
              - coturn_stun_udp.stdout is search('xor_mapped_address=[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+:[0-9]+')
            fail_msg: "coturn did not answer the STUN Binding request over UDP ({{ coturn_stun_udp.stdout | default('no output') }})"
            success_msg: "coturn answered the STUN Binding request over UDP ({{ coturn_stun_udp.stdout }})"

        # The plain STUN port is published over TCP as well as UDP, by two separate
        # port bindings in the systemd unit. Probing both is what keeps either of
        # them from silently stopping being rendered.
        - name: Send a STUN Binding request to coturn over TCP
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import socket

                # Over TCP a STUN message goes on the wire exactly as it does over
                # UDP, with no extra framing (RFC 5389, section 7.2.2).
                request = (
                    b"\x00\x01\x00\x00"
                    b"\x21\x12\xa4\x42"
                    b"MOLECULETCPS"
                )

                sock = socket.create_connection(("127.0.0.1", 3478), timeout=5)
                sock.sendall(request)
                response = sock.recv(2048)

                print("type=0x%04x txid=%s" % (
                    int.from_bytes(response[0:2], "big"),
                    "ok" if response[8:20] == request[8:20] else "bad",
                ))
          register: coturn_stun_tcp
          changed_when: false

        - name: Assert coturn answered the STUN Binding request over TCP
          ansible.builtin.assert:
            that:
              - "'type=0x0101' in coturn_stun_tcp.stdout"
              - "'txid=ok' in coturn_stun_tcp.stdout"
            fail_msg: "coturn did not answer the STUN Binding request over TCP ({{ coturn_stun_tcp.stdout | default('no output') }})"
            success_msg: "coturn answered the STUN Binding request over TCP ({{ coturn_stun_tcp.stdout }})"

        # STUN Binding is answered by any coturn that is listening at all, and says
        # nothing about the authentication that turnserver.conf configures. A TURN
        # Allocate carrying no credentials must be turned away with a 401 and a
        # fresh nonce to authenticate against - the long-term-credential handshake
        # proving itself, without this scenario having to complete an allocation
        # and hold a relay open.
        #
        # The realm in that challenge is rendered from `coturn_realm`, which the
        # role derives as `turn.<coturn_hostname>`, so asserting on it ties the
        # challenge back to the configuration this scenario asked for.
        - name: Send a TURN Allocate request to coturn without credentials
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import socket

                # An Allocate request (message type 0x0003) whose only attribute is
                # REQUESTED-TRANSPORT (0x0019) asking for UDP (protocol number 17),
                # hence the 8-byte body length.
                request = (
                    b"\x00\x03\x00\x08"
                    b"\x21\x12\xa4\x42"
                    b"MOLECULEALLO"
                    b"\x00\x19\x00\x04\x11\x00\x00\x00"
                )

                sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                sock.settimeout(5)
                sock.sendto(request, ("127.0.0.1", 3478))
                response, _ = sock.recvfrom(2048)

                attributes = {}
                offset = 20
                end = 20 + int.from_bytes(response[2:4], "big")
                while offset + 4 <= end:
                    attribute_type = int.from_bytes(response[offset:offset + 2], "big")
                    length = int.from_bytes(response[offset + 2:offset + 4], "big")
                    attributes[attribute_type] = response[offset + 4:offset + 4 + length]
                    offset += 4 + length + (-length % 4)

                # ERROR-CODE (0x0009) keeps the class in byte 2 and the number in
                # byte 3, so a 401 arrives as 4 and 1.
                error = attributes.get(0x0009, b"\x00\x00\x00\x00")

                print("type=0x%04x error_code=%d%02d realm=%s nonce_length=%d" % (
                    int.from_bytes(response[0:2], "big"),
                    error[2],
                    error[3],
                    attributes.get(0x0014, b"none").decode("utf-8", "replace"),
                    len(attributes.get(0x0015, b"")),
                ))
          register: coturn_turn_allocate
          changed_when: false

        - name: Assert coturn challenges an unauthenticated TURN Allocate
          ansible.builtin.assert:
            that:
              # 0x0113 is an Allocate error response.
              - "'type=0x0113' in coturn_turn_allocate.stdout"
              - "'error_code=401' in coturn_turn_allocate.stdout"
              - "'realm=turn.' ~ coturn_hostname ~ ' ' in coturn_turn_allocate.stdout"
              - coturn_turn_allocate.stdout is search('nonce_length=[1-9][0-9]*')
            fail_msg: >-
              coturn did not challenge an unauthenticated TURN Allocate as configured
              ({{ coturn_turn_allocate.stdout | default('no output') }})
            success_msg: "coturn challenges an unauthenticated TURN Allocate ({{ coturn_turn_allocate.stdout }})"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "coturn_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: coturn_restarts_before
              loop: "{{ coturn_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: coturn_restarts_after
              loop: "{{ coturn_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - coturn_restarts_after.results | map(attribute='status.NRestarts') | list == coturn_restarts_before.results | map(attribute='status.NRestarts') | list
                  - coturn_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in coturn_verify_units | zip(coturn_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in coturn_verify_units | zip(coturn_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in coturn_verify_units | zip(coturn_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the coturn verification summary
          ansible.builtin.debug:
            msg:
              - "coturn systemd: {% for unit, state in coturn_verify_units | zip(coturn_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "coturn restarts: {% for unit, restarts in coturn_verify_units | zip(coturn_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "coturn version: {{ coturn_version_reported.stdout | trim }}"
              - "coturn STUN over UDP: {{ coturn_stun_udp.stdout }}"
              - "coturn STUN over TCP: {{ coturn_stun_tcp.stdout }}"
              - "coturn TURN Allocate without credentials: {{ coturn_turn_allocate.stdout }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the coturn systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=coturn.service
          register: coturn_service_log
          changed_when: false

        - name: Show the coturn systemd service log
          ansible.builtin.debug:
            var: coturn_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "coturn verification failed. The systemd service log is printed above."
